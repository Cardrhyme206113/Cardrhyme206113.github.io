name: Build PPSSPP VSH Web

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"
  push:
    branches: [pages]
    paths:
      - ".github/workflows/build-ppsspp-vsh.yml"
      - ".github/ppsspp-vsh-trigger"

permissions:
  contents: write

concurrency:
  group: ppsspp-vsh-web
  cancel-in-progress: false

jobs:
  build:
    name: Build current PPSSPP + VSH for WebAssembly
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:5.0.7

    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v6
        with:
          ref: pages
          fetch-depth: 0

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git ninja-build ca-certificates python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch PPSSPP WASM fork and current upstream
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _ppsspp-build
          mkdir -p _ppsspp-build

          git clone --branch wasm https://github.com/root-hunter/ppsspp-wasm.git _ppsspp-build/ppsspp-wasm
          git -C _ppsspp-build/ppsspp-wasm config user.name "github-actions[bot]"
          git -C _ppsspp-build/ppsspp-wasm config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C _ppsspp-build/ppsspp-wasm remote add upstream https://github.com/hrydgard/ppsspp.git

          # Transplant the VSH work onto the proven SDL2/WASM port instead of
          # merging all current upstream changes (which have moved to SDL3).
          VSH_COMMITS=(
            02aedb598ddabff0a097d3fc695ca86e9b7adc54
            b00e239e41bbd61e449f1b351a6573804e9ad695
            e64ed141b35264de24a00dd96cd3bbda9c049abd
            3f192a535eba1399909f119fd5be17065a9accbb
            c989c2553e1099730736d965c221823fe974fa55
            ed5c05fb28ccea13dd0c352f4260827cb903c70c
            e7e8d362f0b7bc2a03e7fbdf28d04a722927b822
            708e7e1d9c276ad6961fd990a1a1c5ee8c303f5c
            9de3eb1244318866dff236280e59922e23739d24
            fb385e76271e5c47f10218cef6c340f2983e4d58
          )

          for c in "${VSH_COMMITS[@]}"; do
            git -C _ppsspp-build/ppsspp-wasm fetch --no-tags upstream "$c"
            parents="$(git -C _ppsspp-build/ppsspp-wasm rev-list --parents -n 1 "$c" | awk '{print NF-1}')"
            set +e
            if [ "$parents" -gt 1 ]; then
              git -C _ppsspp-build/ppsspp-wasm cherry-pick -X ours -m 1 "$c"
            else
              git -C _ppsspp-build/ppsspp-wasm cherry-pick -X ours "$c"
            fi
            PICK_RC=$?
            set -e

            if [ "$PICK_RC" -ne 0 ]; then
              UNMERGED="$(git -C _ppsspp-build/ppsspp-wasm diff --name-only --diff-filter=U)"

              for p in AGENTS.md Core/CMakeLists.txt UI/CMakeLists.txt Core/CmdLine.cpp Core/CmdLine.h Core/Debugger/WebSocket/LogConfigSubscriber.cpp assets/lang/nn_NO.ini; do
                if printf '%s\n' "$UNMERGED" | grep -Fxq "$p"; then
                  git -C _ppsspp-build/ppsspp-wasm rm -f --ignore-unmatch "$p"
                fi
              done

              for p in UI/NativeApp.cpp headless/Headless.cpp; do
                if printf '%s\n' "$UNMERGED" | grep -Fxq "$p"; then
                  git -C _ppsspp-build/ppsspp-wasm checkout --ours -- "$p"
                  git -C _ppsspp-build/ppsspp-wasm add "$p"
                fi
              done

              UNMERGED="$(git -C _ppsspp-build/ppsspp-wasm diff --name-only --diff-filter=U)"
              if [ -n "$UNMERGED" ]; then
                echo "Unresolved VSH transplant conflicts in $c:"
                echo "$UNMERGED"
                exit 1
              fi
              git -C _ppsspp-build/ppsspp-wasm -c core.editor=true cherry-pick --continue
            fi
          done

          git -C _ppsspp-build/ppsspp-wasm submodule sync --recursive
          git -C _ppsspp-build/ppsspp-wasm submodule update --init --recursive

          # The WASM fork keeps core/UI sources in the top-level CMakeLists.
          # Register source files introduced by the VSH/firmware PRs there.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("_ppsspp-build/ppsspp-wasm/CMakeLists.txt")
          s = p.read_text()
          additions = [
              ("\tCore/Util/RecentFiles.cpp\n", "\tCore/Util/PSARUnpack.cpp\n\tCore/Util/PSARUnpack.h\n"),
              ("\tCore/HLE/sceUsbMic.cpp\n", "\tCore/HLE/sceResmgr.cpp\n\tCore/HLE/sceResmgr.h\n\tCore/HLE/sceVshBridge.cpp\n\tCore/HLE/sceVshBridge.h\n"),
              ("\tCore/HW/BufferQueue.cpp\n", "\tCore/HW/GpioMMIO.cpp\n\tCore/HW/GpioMMIO.h\n"),
              ("\tUI/InstallZipScreen.cpp\n", "\tUI/InstallUpdateScreen.cpp\n\tUI/InstallUpdateScreen.h\n"),
          ]
          for anchor, extra in additions:
              if extra.splitlines()[0].strip() in s:
                  continue
              if anchor not in s:
                  raise SystemExit(f"CMake anchor missing: {anchor!r}")
              s = s.replace(anchor, anchor + extra, 1)
          p.write_text(s)
          PY

          # Add browser-native VSH boot glue.  The WASM fork intentionally removed
          # the newer desktop CmdLine layer, but its NativeInit still parses argv.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("_ppsspp-build/ppsspp-wasm/UI/NativeApp.cpp")
          s = p.read_text()
          s = s.replace(
              "bool gotBootFilename = false;\n",
              "bool gotBootFilename = false;\n\tbool bootVSH = false;\n",
              1,
          )
          s = s.replace(
              "\t\t\tcase '-':\n",
              "\t\t\tcase '-':\n"
              "\t\t\t\tif (!strcmp(argv[i], \"--vsh\")) {\n"
              "\t\t\t\t\tbootVSH = true;\n"
              "\t\t\t\t\tbreak;\n"
              "\t\t\t\t}\n",
              1,
          )
          s = s.replace(
              "\n\tif (fileToLog) {\n",
              "\n\tif (bootVSH && boot_filename.empty()) {\n"
              "\t\tboot_filename = g_Config.flash0Directory / \"vsh/module/vshmain.prx\";\n"
              "\t\tskipLogo = true;\n"
              "\t}\n\n"
              "\tif (fileToLog) {\n",
              1,
          )
          if "boot_filename = g_Config.flash0Directory / \"vsh/module/vshmain.prx\";" not in s:
              raise SystemExit("failed to inject WASM VSH boot glue")
          p.write_text(s)
          PY

          # VSH core support must exist in the transplanted source.
          grep -R --line-number --fixed-strings -- "sceVshBridge" _ppsspp-build/ppsspp-wasm/Core/HLE | head -20

      - name: Build PPSSPP WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          make -C _ppsspp-build/ppsspp-wasm wasm-release \
            CMAKE=/usr/bin/cmake \
            WASM_JOBS="-j$(nproc)" \
            WASM_INITIAL_MEMORY=268435456 \
            WASM_MAXIMUM_MEMORY=1073741824

          test -f _ppsspp-build/ppsspp-wasm/build-wasm-release/PPSSPPSDL.js
          test -f _ppsspp-build/ppsspp-wasm/build-wasm-release/PPSSPPSDL.wasm
          test -f _ppsspp-build/ppsspp-wasm/build-wasm-release/PPSSPPSDL.data

      - name: Build static web shell
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch wasm https://github.com/root-hunter/ppsspp-web.git _ppsspp-build/ppsspp-web
          npm --prefix _ppsspp-build/ppsspp-web/wasm-page ci

          # Dedicated PSP/XMB build: when no game is selected, request VSH boot.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("_ppsspp-build/ppsspp-web/wasm-page/public/ppsspp-runtime.js")
          s = p.read_text()
          old = "Module.arguments.length = 0;\n          Module.arguments.push(...emulatorLaunchArgs());"
          new = "Module.arguments.length = 0;\n          if (!gameArg) Module.arguments.push(\\"--vsh\\");\n          Module.arguments.push(...emulatorLaunchArgs());"
          if old not in s:
              raise SystemExit("runtime argument insertion point not found")
          p.write_text(s.replace(old, new, 1))
          PY

          make -C _ppsspp-build/ppsspp-web app-build-pages \
            WASM_ROOT="$GITHUB_WORKSPACE/_ppsspp-build/ppsspp-wasm" \
            PAGES_WASM_BUILD=release

          DIST="$GITHUB_WORKSPACE/_ppsspp-build/ppsspp-web/wasm-page/dist/ppsspp-web"
          test -f "$DIST/index.html"
          test -f "$DIST/build-wasm/PPSSPPSDL.wasm"

      - name: Publish under /psp
        shell: bash
        run: |
          set -euo pipefail
          DIST="$GITHUB_WORKSPACE/_ppsspp-build/ppsspp-web/wasm-page/dist/ppsspp-web"

          rm -rf psp
          mkdir -p psp
          cp -a "$DIST/." psp/

          cat > psp/BUILD-INFO.txt <<EOF
          PPSSPP VSH Web build
          Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          PPSSPP WASM/VSH tree: $(git -C _ppsspp-build/ppsspp-wasm rev-parse HEAD)
          Static path: /psp/
          Firmware and game files are not bundled.
          EOF

          rm -rf _ppsspp-build

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psp
          if git diff --cached --quiet; then
            echo "No published files changed."
            exit 0
          fi
          git commit -m "Build PPSSPP VSH web"
          git push origin pages
