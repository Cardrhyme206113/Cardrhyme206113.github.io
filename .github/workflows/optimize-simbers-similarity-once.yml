name: Optimize Simbers long-song similarity once

on:
  push:
    branches: [pages]
    paths:
      - '.github/workflows/optimize-simbers-similarity-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
          fetch-depth: 0
      - name: Patch similarity engine and validate behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYTHON'
          from pathlib import Path
          p=Path("simbers5.html")
          text=p.read_text(encoding="utf-8")
          assert "async function analyzeBeatSynchronousPatterns(A,samples,sampleRate,opts){" in text
          assert "const similarityData=new Float32Array(n*n);" in text
          assert "comparedPairs:n>1?n*(n-1)/2:0," in text
          
          helper = """
          // Large-song mode avoids materializing the quadratic all-pairs matrix.
          // LSH-like multiview buckets retrieve likely candidates, then the existing
          // full musical fingerprint distance verifies every shortlisted pair.
          async function buildSparseMelodyGroups(segments,fingerprints,threshold,scale,contextBeats){
            const n=fingerprints.length;
            const bins=MELODY_FINGERPRINT_BINS;
            const buckets=new Map();
            const seen=new Int32Array(n);
            const bestScores=new Float32Array(n);
            const nearest=new Int32Array(n);
            nearest.fill(-1);
            const segmentCluster=new Int32Array(n);
            const clusters=[];
            let comparedPairs=0;
            const distance=(i,j)=>{
              comparedPairs++;
              return melodyFingerprintDistance(fingerprints[i],fingerprints[j]);
            };
            const score=(i,j)=>Math.exp(-scale*distance(i,j));
            const quant=(v,step)=>Math.floor(v/step);
            function keys(fp){
              const early=(fp[0]+fp[1]+fp[2]+fp[3])/4;
              const late=(fp[8]+fp[9]+fp[10]+fp[11])/4;
              const contour=(fp[bins+2]+fp[bins+5]+fp[bins+8])/3;
              const rhythm=(fp[bins*3+2]+fp[bins*3+6]+fp[bins*3+9])/3;
              const activity=fp[bins*4];
              return [
                "p:"+quant(early,.30)+":"+quant(late,.30),
                "ps:"+quant(early+.15,.30)+":"+quant(late+.15,.30),
                "c:"+quant(contour,.22)+":"+quant(rhythm,.32),
                "a:"+quant(activity,.24)+":"+quant(late-early,.25)
              ];
            }
          
            let lastYield=performance.now();
            for(let i=0;i<n;i++){
              const fpKeys=keys(fingerprints[i]);
              let bestGroup=-1,bestGroupScore=threshold;
              const groupChecks=new Map();
              function consider(j){
                if(j===i||seen[j]===i+1)return;
                seen[j]=i+1;
                const similarity=score(i,j);
                if(Math.abs(segments[i].beatIndex-segments[j].beatIndex)>contextBeats){
                  if(similarity>bestScores[i]){
                    bestScores[i]=similarity;
                    nearest[i]=j;
                  }
                  if(similarity>bestScores[j]){
                    bestScores[j]=similarity;
                    nearest[j]=i;
                  }
                }
                if(similarity>=threshold){
                  const groupId=segmentCluster[j];
                  let representativeScore=groupChecks.get(groupId);
                  if(representativeScore===undefined){
                    const rep=clusters[groupId].medoid;
                    representativeScore=rep===j?similarity:score(i,rep);
                    groupChecks.set(groupId,representativeScore);
                  }
                  if(representativeScore>=threshold && representativeScore>bestGroupScore){
                    bestGroup=groupId;
                    bestGroupScore=representativeScore;
                  }
                }
              }
              for(const key of fpKeys){
                const bucket=buckets.get(key);
                if(!bucket)continue;
                const recentStart=Math.max(0,bucket.length-12);
                const spacedCount=Math.min(24,recentStart);
                for(let k=0;k<spacedCount;k++){
                  consider(bucket[Math.floor((k+.5)*recentStart/spacedCount)]);
                }
                for(let k=recentStart;k<bucket.length;k++)consider(bucket[k]);
              }
          
              if(bestGroup<0){
                bestGroup=clusters.length;
                clusters.push({members:[i],medoid:i});
              }else{
                clusters[bestGroup].members.push(i);
              }
              segmentCluster[i]=bestGroup;
              for(const key of fpKeys){
                let bucket=buckets.get(key);
                if(!bucket){bucket=[];buckets.set(key,bucket);}
                bucket.push(i);
              }
              const now=performance.now();
              if(now-lastYield>25){
                setProgress(.90+.07*i/Math.max(1,n),
                  "Comparing likely musical patterns "+(i+1)+"/"+n+"…");
                await nextTick();
                lastYield=performance.now();
              }
            }
          
            // Compute a compact 1D musical placement from representative landmarks.
            // This avoids the separate O(clusterCount^2) distance + MDS matrices.
            const count=clusters.length;
            const coords=new Float32Array(count);
            if(count===1){
              coords[0]=.5;
            }else if(count>1){
              const anchorCount=Math.min(32,count);
              const anchors=Array.from({length:anchorCount},
                (_,i)=>Math.min(count-1,Math.floor((i+.5)*count/anchorCount)));
              const distances=anchors.map(ai=>anchors.map(aj=>
                distance(clusters[ai].medoid,clusters[aj].medoid)));
              const positions=mdsOneDimension(distances);
              const anchorMap=new Map(anchors.map((index,i)=>[index,i]));
              for(let c=0;c<count;c++){
                if(anchorMap.has(c)){
                  coords[c]=positions[anchorMap.get(c)];
                  continue;
                }
                let closest=-1,second=-1,d1=Infinity,d2=Infinity;
                for(let a=0;a<anchorCount;a++){
                  const d=distance(clusters[c].medoid,clusters[anchors[a]].medoid);
                  if(d<d1){second=closest;d2=d1;closest=a;d1=d;}
                  else if(d<d2){second=a;d2=d;}
                }
                if(second<0)coords[c]=positions[closest]??.5;
                else{
                  const w1=1/Math.max(.02,d1),w2=1/Math.max(.02,d2);
                  coords[c]=(positions[closest]*w1+positions[second]*w2)/(w1+w2);
                }
              }
            }
            return {clusters,coords,segmentCluster,bestScores,nearest,comparedPairs};
          }
          
          """
          anchor="async function analyzeBeatSynchronousPatterns(A,samples,sampleRate,opts){"
          if text.count(anchor)!=1: raise RuntimeError("Analysis function not unique")
          text=text.replace(anchor,helper+anchor,1)
          
          begin=text.index("  const similarityData=new Float32Array(n*n);",text.index(anchor))
          end=text.index("  for(let c=0;c<clusters.length;c++){\n    const cluster=clusters[c];",begin)
          old=text[begin:end]
          assert "const segmentCluster=new Int32Array(n)" in old
          replacement = """
            const similarityScale=advNumber("patterns.similarityScale",4);
            let similarities=null;
            let clusters=[],coords=[],segmentCluster=new Int32Array(n),sparseMatch=null;
            let comparedPairs=n>1?n*(n-1)/2:0;
            const similarityStarted=performance.now();
            let similarityMs=0;
            let similarityPostStart=similarityStarted;
            if(n<=1400){
              // Retain the original exact all-pairs matcher for ordinary songs.
              const similarityData=new Float32Array(n*n);
              similarities=Array.from({length:n},(_,i)=>similarityData.subarray(i*n,(i+1)*n));
              let lastYield=similarityStarted;
              for(let i=0;i<n;i++){
                similarities[i][i]=1;
                for(let j=i+1;j<n;j++){
                  const d=melodyFingerprintDistance(fingerprints[i],fingerprints[j]);
                  const sim=Math.exp(-similarityScale*d);
                  similarities[i][j]=sim;
                  similarities[j][i]=sim;
                }
                const now=performance.now();
                if(now-lastYield>20){
                  setProgress(.90+.07*(i/Math.max(1,n)),
                    "Comparing event-state "+(i+1)+"/"+n+"…");
                  await nextTick();
                  lastYield=performance.now();
                }
              }
              similarityMs=performance.now()-similarityStarted;
              similarityPostStart=performance.now();
              for(let i=0;i<n;i++){
                let best=-1,bestSim=-1;
                for(let c=0;c<clusters.length;c++){
                  const sim=similarities[i][clusters[c].medoid];
                  if(sim>bestSim){bestSim=sim;best=c;}
                }
                if(best>=0&&bestSim>=opts.threshold)clusters[best].members.push(i);
                else clusters.push({members:[i],medoid:i});
              }
              for(const cluster of clusters){
                let bestMember=cluster.members[0],bestScore=-Infinity;
                for(const candidate of cluster.members){
                  let score=0;
                  for(const member of cluster.members)score+=similarities[candidate][member];
                  if(score>bestScore){bestScore=score;bestMember=candidate;}
                }
                cluster.medoid=bestMember;
              }
              const clusterDistances=clusters.map(a=>clusters.map(b=>
                melodyFingerprintDistance(fingerprints[a.medoid],fingerprints[b.medoid])));
              coords=mdsOneDimension(clusterDistances);
              for(let c=0;c<clusters.length;c++){
                for(const member of clusters[c].members)segmentCluster[member]=c;
              }
            }else{
              // Bounded-memory approximate discovery, exact musical comparisons on
              // candidates; avoids n*n arrays and all-pairs O(n^2) processing.
              sparseMatch=await buildSparseMelodyGroups(
                segments,fingerprints,opts.threshold,similarityScale,opts.contextBeats);
              clusters=sparseMatch.clusters;
              coords=sparseMatch.coords;
              segmentCluster=sparseMatch.segmentCluster;
              comparedPairs=sparseMatch.comparedPairs;
              similarityMs=performance.now()-similarityStarted;
              similarityPostStart=performance.now();
            }
            timingProfileSet("similarityAllPairs",similarityMs);
            timingProfileNote("similarityPairs",comparedPairs);
          
          """
          text=text[:begin]+replacement+text[end:]
          # The existing post-processing works for both modes; use sparse best matches
          # rather than scanning a non-existent all-pairs matrix.
          old_tail = """    let repeatScore=0,nearest=null;
              for(let j=0;j<n;j++){
                if(i===j||Math.abs(segments[i].beatIndex-segments[j].beatIndex)<=opts.contextBeats)continue;
                if(similarities[i][j]>repeatScore){
                  repeatScore=similarities[i][j];
                  nearest=j;
                }
              }
              const simToMedoid=similarities[i][cluster.medoid]||1;"""
          new_tail = """    let repeatScore=0,nearest=null;
              if(sparseMatch){
                repeatScore=sparseMatch.bestScores[i];
                nearest=sparseMatch.nearest[i]<0?null:sparseMatch.nearest[i];
              }else{
                for(let j=0;j<n;j++){
                  if(i===j||Math.abs(segments[i].beatIndex-segments[j].beatIndex)<=opts.contextBeats)continue;
                  if(similarities[i][j]>repeatScore){
                    repeatScore=similarities[i][j];
                    nearest=j;
                  }
                }
              }
              const simToMedoid=(similarities
                ? similarities[i][cluster.medoid]
                : Math.exp(-similarityScale*melodyFingerprintDistance(
                    fingerprints[i],fingerprints[cluster.medoid])))||1;"""
          if text.count(old_tail)!=1: raise RuntimeError("Repeat similarity patch anchor mismatch")
          text=text.replace(old_tail,new_tail,1)
          oldlog="""    comparedPairs:n>1?n*(n-1)/2:0,
              similarityMs:+similarityMs.toFixed(1),
              method:"all-pairs compact fingerprint" """
          # avoid exact indentation mismatch
          oldlog=oldlog.rstrip()
          newlog="""    comparedPairs,
              similarityMs:+similarityMs.toFixed(1),
              method:sparseMatch?"sparse candidates, exact fingerprint rerank":"all-pairs compact fingerprint" """
          newlog=newlog.rstrip()
          if text.count(oldlog)!=1: raise RuntimeError("Log patch anchor mismatch")
          text=text.replace(oldlog,newlog,1)
          oldperf="      comparedPairs:n>1?n*(n-1)/2:0,"
          if text.count(oldperf)!=1: raise RuntimeError("Performance count not unique")
          text=text.replace(oldperf,"      comparedPairs,",1)
          oldavg="""        c.members.reduce((sum,i)=>sum+(similarities[i][c.medoid]||0),0)/c.members.length"""
          newavg="""        c.members.reduce((sum,i)=>sum+(similarities
                    ? similarities[i][c.medoid]
                    : Math.exp(-similarityScale*melodyFingerprintDistance(
                        fingerprints[i],fingerprints[c.medoid]))),0)/c.members.length"""
          if text.count(oldavg)!=1: raise RuntimeError("Average similarity anchor mismatch")
          text=text.replace(oldavg,newavg,1)
          assert 'let similarities=null' in text
          assert 'new Float32Array(n*n)' in text
          assert 'sparseMatch=await buildSparseMelodyGroups(' in text
          assert 'method:sparseMatch?' in text
          p.write_text(text,encoding="utf-8")
          print("Long-track sparse similarity patch complete")
          
          PYTHON
          python3 <<'PYTHON'
          from pathlib import Path
          import re
          s=Path("simbers5.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script[^>]*>(.*?)</script>",s,re.IGNORECASE|re.DOTALL)
          scripts=[x for x in scripts if "async function analyzeBeatSynchronousPatterns(" in x]
          if len(scripts)!=1: raise RuntimeError("Main JS script extraction failed")
          Path("/tmp/simbers-optimized-main.js").write_text(scripts[0],encoding="utf-8")
          
          PYTHON
          node --check /tmp/simbers-optimized-main.js
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/simbers-optimized-main.js','utf8');
          const start=s.indexOf('async function buildSparseMelodyGroups(');
          const end=s.indexOf('async function analyzeBeatSynchronousPatterns(',start);
          if(start<0||end<0)throw new Error('Sparse matcher missing');
          const src=s.slice(start,end);
          const compile=new Function('MELODY_FINGERPRINT_BINS','melodyFingerprintDistance',
            'performance','setProgress','nextTick','mdsOneDimension',src+'return buildSparseMelodyGroups;');
          const distance=(a,b)=>{let v=0;for(let i=0;i<a.length;i++)v+=Math.abs(a[i]-b[i]);return v/a.length;};
          const matcher=compile(12,distance,performance,()=>{},()=>Promise.resolve(),
            d=>d.map((_,i)=>d.length<=1?.5:i/(d.length-1)));
          const count=3000;const segments=[],fingerprints=[];
          for(let i=0;i<count;i++){
            segments.push({beatIndex:i});
            const pattern=i%32;
            const a=new Float32Array(49);
            for(let j=0;j<a.length;j++)a[j]=Math.sin(pattern*.11+j*.3)*.4+(pattern%3)*.1;
            fingerprints.push(a);
          }
          (async()=>{
           const result=await matcher(segments,fingerprints,.75,4,4);
           if(result.segmentCluster.length!==count||result.bestScores.length!==count)throw new Error('Result shape wrong');
           if(result.clusters.length<1||result.clusters.length>count)throw new Error('Cluster bounds wrong');
           if(result.comparedPairs>=count*(count-1)/2)throw new Error('Sparse comparisons not bounded');
           if(!result.nearest.some(x=>x>=0))throw new Error('Repeated motifs were not found');
           if(!result.coords.every(Number.isFinite))throw new Error('Nonfinite coordinates');
           console.log('Sparse matcher synthetic smoke test OK:',count,'events,',
             result.clusters.length,'clusters,',result.comparedPairs,'fingerprint comparisons');
          })().catch(err=>{console.error(err);process.exitCode=1});
          
          NODE
          rm .github/workflows/optimize-simbers-similarity-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simbers5.html .github/workflows/optimize-simbers-similarity-once.yml
          git commit -m 'Bound similarity processing memory and work for long tracks'
          git push origin pages
