name: Patch Simbers v5 decode progress and PCM speed

on:
  push:
    branches: [pages]
    paths:
      - '.github/workflows/patch-simbers-decode-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
          fetch-depth: 0
      - name: Apply focused UI and resampling improvements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("simbers5.html")
          text=p.read_text(encoding="utf-8")
          def change(old,new):
              global text
              count=text.count(old)
              if count!=1:
                  raise RuntimeError(f"Expected exactly one {old[:85]!r}, found {count}")
              text=text.replace(old,new,1)

          change(""".statusBar progress::-moz-progress-bar{
            background:var(--primary);
          }""",""".statusBar progress::-moz-progress-bar{
            background:var(--primary);
          }

          /* The browser's native audio decoder exposes no percentage progress. */
          .statusBar.isDecodingAudio progress{opacity:0}
          .statusBar.isDecodingAudio::after{
            content:"";
            position:absolute;
            top:0;
            bottom:0;
            left:0;
            width:28%;
            background:var(--primary);
            opacity:.55;
            pointer-events:none;
            animation:simbersDecodeSweep 1.65s ease-in-out infinite;
          }
          @keyframes simbersDecodeSweep{
            from{transform:translateX(-105%)}
            to{transform:translateX(370%)}
          }
          @media(prefers-reduced-motion:reduce){
            .statusBar.isDecodingAudio::after{animation:none;transform:none;left:36%}
          }""")

          change("""function setProgress(v, text){
            els.progress.value = clamp(v,0,1);
            els.pct.textContent = Math.round(clamp(v,0,1)*100)+"%";
            if(text){
              els.status.textContent = text;
              els.mapStatus.textContent = text;
            }
          }""","""function setProgress(v, text){
            els.progress.value = clamp(v,0,1);
            els.pct.textContent = Math.round(clamp(v,0,1)*100)+"%";
            if(text){
              els.status.textContent = text;
              els.mapStatus.textContent = text;
            }
          }

          // FileReader reports real disk-read progress; decodeAudioData does not.
          function readAudioWithProgress(blob){
            return new Promise((resolve,reject)=>{
              const reader=new FileReader();
              reader.onprogress=e=>{
                if(e.lengthComputable&&e.total>0){
                  const pct=Math.min(1,e.loaded/e.total);
                  setProgress(.01+.03*pct,`Reading audio… ${Math.round(pct*100)}%`);
                }
              };
              reader.onload=()=>resolve(reader.result);
              reader.onerror=()=>reject(reader.error||new Error("Audio file read failed"));
              reader.onabort=()=>reject(new Error("Audio file read canceled"));
              reader.readAsArrayBuffer(blob);
            });
          }""")

          change("""    setProgress(.01,"Decoding audio…");
              let stage=performance.now();
              const data=await sourceBlob.arrayBuffer();
              const ctx=new (window.AudioContext||window.webkitAudioContext)();
              const decoded=await ctx.decodeAudioData(data.slice(0));
              timingProfileSet("decodeAudio",performance.now()-stage);""",
          """    setProgress(.01,"Reading audio…");
              let stage=performance.now();
              const data=await readAudioWithProgress(buildBlob);
              const ctx=new (window.AudioContext||window.webkitAudioContext)();
              const decodeStarted=performance.now();
              setProgress(.04,"Decoding audio…");
              const statusBar=els.progress.parentElement;
              statusBar.classList.add("isDecodingAudio");
              const decodeTicker=setInterval(()=>{
                const sec=Math.floor((performance.now()-decodeStarted)/1000);
                const label=`Decoding audio… ${sec}s elapsed`;
                els.status.textContent=label;
                els.mapStatus.textContent=label;
              },1000);
              let decoded;
              try{
                decoded=await ctx.decodeAudioData(data.slice(0));
              }finally{
                clearInterval(decodeTicker);
                statusBar.classList.remove("isDecodingAudio");
              }
              timingProfileSet("decodeAudio",performance.now()-stage);""")

          change("""    stage=performance.now();
              const mono=downmixAndResample(decoded,analysisRate,maxSeconds);""",
          """    setProgress(.045,"Preparing PCM samples…");
              stage=performance.now();
              const mono=downmixAndResample(decoded,analysisRate,maxSeconds);""")

          change("""  for(let i=0;i<outLen;i++){
              const pos=i*srcRate/targetRate, i0=Math.floor(pos), i1=Math.min(srcLen-1,i0+1), t=pos-i0;
              let s=0;
              for(let c=0;c<channels;c++) s += channelData[c][i0]*(1-t)+channelData[c][i1]*t;
              out[i]=s/channels;
            }
            return out;""",
          """  if(channels===2){
              // Fast stereo path: same interpolation and precision, no channel loop.
              const left=channelData[0],right=channelData[1];
              for(let i=0;i<outLen;i++){
                const pos=i*srcRate/targetRate, i0=Math.floor(pos), i1=Math.min(srcLen-1,i0+1), t=pos-i0;
                const a=left[i0]*(1-t)+left[i1]*t;
                const b=right[i0]*(1-t)+right[i1]*t;
                out[i]=(a+b)/2;
              }
              return out;
            }
            for(let i=0;i<outLen;i++){
              const pos=i*srcRate/targetRate, i0=Math.floor(pos), i1=Math.min(srcLen-1,i0+1), t=pos-i0;
              let s=0;
              for(let c=0;c<channels;c++) s += channelData[c][i0]*(1-t)+channelData[c][i1]*t;
              out[i]=s/channels;
            }
            return out;""")

          change("""  return sourceChannels.map(source=>{
              const out=new Float32Array(outLen);
              for(let i=0;i<outLen;i++){
                const pos=i*srcRate/targetRate;
                const i0=Math.floor(pos);
                const i1=Math.min(srcLen-1,i0+1);
                const t=pos-i0;
                out[i]=source[i0]*(1-t)+source[i1]*t;
              }
              return out;
            });""",
          """  if(srcRate===targetRate){
              return sourceChannels.map(source=>source.slice(0,srcLen));
            }
            const outputs=sourceChannels.map(()=>new Float32Array(outLen));
            // Calculate interpolation offsets once per output sample for all channels.
            for(let i=0;i<outLen;i++){
              const pos=i*srcRate/targetRate;
              const i0=Math.floor(pos);
              const i1=Math.min(srcLen-1,i0+1);
              const t=pos-i0;
              for(let c=0;c<sourceChannels.length;c++){
                const source=sourceChannels[c];
                outputs[c][i]=source[i0]*(1-t)+source[i1]*t;
              }
            }
            return outputs;""")

          assert 'isDecodingAudio' in text
          assert 'readAudioWithProgress(buildBlob)' in text
          assert 'maxSeconds":3600' in text
          p.write_text(text,encoding="utf-8")
          print("Patched Simbers v5 decoding indicator and exact PCM resampling optimizations.")
          PY
          # Validate the main JS script still parses.
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path("simbers5.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script\\b[^>]*>([\\s\\S]*?)</script>",t,re.IGNORECASE)
          scripts=[s for s in scripts if "async function runAnalysis()" in s]
          if len(scripts)!=1: raise RuntimeError(f"Expected one main script, found {len(scripts)}")
          Path("/tmp/simbers-main.js").write_text(scripts[0],encoding="utf-8")
          PY
          node --check /tmp/simbers-main.js
          rm .github/workflows/patch-simbers-decode-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simbers5.html .github/workflows/patch-simbers-decode-once.yml
          git commit -m 'Show audio decoding activity and speed up PCM resampling'
          git push origin pages
