name: One-time Simbers v5 60-minute duration update

on:
  push:
    branches: [pages]
    paths:
      - '.github/workflows/patch-simbers-duration-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
          fetch-depth: 0
      - name: Apply narrowly scoped duration patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("simbers5.html")
          text = p.read_text(encoding="utf-8")

          changes = [
              ('min="10" max="1800" step="10" data-adv-key="audio.maxSeconds"',
               'min="10" max="3600" step="10" data-adv-key="audio.maxSeconds"'),
              ('"maxSeconds":300,"channels"',
               '"maxSeconds":3600,"channels"'),
              ('Math.min(Math.max(1,advNumber("audio.maxSeconds",300)),decoded.duration)',
               'Math.min(3600,Math.max(1,advNumber("audio.maxSeconds",3600)),decoded.duration)'),
              ('  if(saved)ADV_SETTINGS=advDeepMerge(ADV_SETTINGS,saved);',
               '''  if(saved){
              ADV_SETTINGS=advDeepMerge(ADV_SETTINGS,saved);
              const durationUpgradeKey="simbers-hour-duration-upgrade-v1";
              if(!advStorageGet(durationUpgradeKey)){
                if(saved.audio?.maxSeconds===300){
                  ADV_SETTINGS.audio.maxSeconds=3600;
                  advStorageSet(ADV_STORAGE_KEY,JSON.stringify(ADV_SETTINGS));
                }
                advStorageSet(durationUpgradeKey,"1");
              }
            }'''),
          ]
          for before, after in changes:
              n = text.count(before)
              if n != 1:
                  raise RuntimeError(f"Expected exactly one occurrence of {before[:70]!r}, got {n}")
              text = text.replace(before, after, 1)

          p.write_text(text, encoding="utf-8")
          print("Simbers v5 60-minute cap patched.")
          PY
          rm .github/workflows/patch-simbers-duration-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simbers5.html .github/workflows/patch-simbers-duration-once.yml
          git commit -m 'Allow 60-minute tracks in Simbers v5'
          git push origin pages
