name: Prune obsolete branches
on:
  push:
    branches: [pages]
    paths:
      - .github/workflows/prune-obsolete-branches.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
          persist-credentials: true
      - name: Delete obsolete branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in main simbers-dev; do
            echo "Deleting $branch"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
      - name: Remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prune-obsolete-branches.yml
          git commit -m "Remove one-time obsolete branch cleanup workflow"
          git push origin HEAD:pages
