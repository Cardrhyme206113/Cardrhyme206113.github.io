name: Prune obsolete development branches (one time)
on:
  push:
    branches: [pages]
    paths:
      - '.github/workflows/prune-old-branches-once.yml'
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only reviewed obsolete branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' > /tmp/branches.txt
          removed=0
          failed=0
          while IFS= read -r branch; do
            case "$branch" in
              pages|main|simbers-dev) echo "KEEP $branch"; continue ;;
              backup/*|backup-*|cleanup-simbers-pages|flow-library-mapmaker-v1|flow-showcase-*|pages-refresh-v090-*|pre19-library|release095b4|release095b5|simbers-arcviewer-update|simbers-inline-viewer|simbers-release-cleanup|simbers-v093-ready|temp-clear-bomb-white-button|v3-standalone) ;;
              *) echo "SKIP unreviewed branch $branch"; continue ;;
            esac
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1; then
              echo "DELETED $branch"
              removed=$((removed+1))
            else
              echo "FAILED $branch"
              failed=$((failed+1))
            fi
          done < /tmp/branches.txt
          echo "Deleted $removed branches; failed $failed"
          test "$failed" -eq 0
