<style id="app-styles">
:root{--chat-width:365px;--font-scale:1;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-size:calc(14px * var(--font-scale));overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
input,select,textarea{color:var(--fg);background:#111823;border:1px solid #343d4b;border-radius:9px}
select{padding:10px 12px}
input[type="range"]{width:100%;accent-color:var(--green);cursor:pointer}
input[type="checkbox"]{accent-color:var(--green)}
.icon{width:20px;height:20px;display:inline-block;vertical-align:middle;flex-shrink:0;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;fill:none}
.icon.sm{width:16px;height:16px}
.icon.lg{width:24px;height:24px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.app{display:flex;height:100dvh;min-width:320px;overflow:hidden;background:radial-gradient(ellipse 56% 78% at 35% 46%,#111b24 0,transparent 70%),#090d13}
.call-stage{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;padding:0 21px;overflow:hidden}
.brandless-profile{position:absolute;top:17px;left:2px;background:#111720;border:1px solid #242c37;display:flex;align-items:center;gap:11px;border-radius:999px;padding:5px 13px 5px 5px;max-width:220px;box-shadow:0 2px 20px #0003;white-space:nowrap}
.brandless-profile:hover{background:#18212c}
.brandless-profile img{width:35px;height:35px;border:2px solid #5ddf8c;border-radius:100%;object-fit:cover}
.brandless-profile strong{max-width:120px;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.brandless-profile .icon{width:15px;color:#abb6c4}
.popover{position:absolute;z-index:60;background:#191f29;border:1px solid #36404e;border-radius:12px;box-shadow:0 18px 55px #0009;padding:7px;min-width:210px}
.popover[hidden],.modal-backdrop[hidden],.toast-stack[hidden],.chat-panel[hidden]{display:none!important}
.menu-btn{width:100%;display:flex;align-items:center;gap:10px;padding:11px 11px;border:0;border-radius:7px;background:transparent;text-align:left;font-size:13px;white-space:nowrap}
.menu-btn:hover{background:#2a3342}
.menu-btn .icon{color:#c4cfdd;width:18px;height:18px}
.call-layout{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;position:relative}
.primary-view{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.primary-card{position:relative;height:100%;width:auto;aspect-ratio:16/9;max-width:100%;max-height:100%;overflow:hidden;background:#171e2b;border-radius:12px;border:2px solid #52dc86;box-shadow:0 0 0 1px #4be88733,0 0 28px #38bd7440,0 10px 30px #0008}
.primary-card img.share-media{display:block;width:100%;height:100%;object-fit:cover}
.live{font-size:10px;font-weight:800;background:#5af48a;color:#092614;padding:3px 8px;border-radius:7px}
.quality{color:#c4d1cf}
.icon-btn{border:0;background:transparent;border-radius:7px;display:inline-grid;place-items:center;padding:8px}
.icon-btn:hover{background:#ffffff12}
.focus-person{height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 50%,var(--person-bg, #26445a) 0%,#10151dd0 42%,#0c1018 78%)}
.focus-person .big-avatar{width:min(36vh,260px);aspect-ratio:1;object-fit:cover;border-radius:100%;border:3px solid var(--avatar-border,#455a69);box-shadow:0 0 60px var(--person-glow,#305c7260)}
.focus-person h2{margin:16px 0 4px;font-size:25px}
.focus-person p{color:#c5ccdc;font-size:13px}
.focus-top-actions{position:absolute;top:12px;left:12px;z-index:5;display:flex;gap:7px}
.micro-btn{background:#111923d9;border:1px solid #3b4552;padding:8px 11px;border-radius:7px;display:inline-flex;align-items:center;gap:6px;font-size:12px}
.micro-btn:hover{background:#273444}
.participant-strip{flex-shrink:0;align-items:stretch;width:100%;padding:0 1px 1px;min-width:0}
.participant-tile{flex:1 1 0;max-width:207px;min-width:0;border:1px solid #ffffff18;border-radius:11px;position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--tint) 69%,#1a1e25),color-mix(in srgb,var(--tint) 34%,#121720));display:flex;align-items:center;justify-content:center;transition:filter .2s,border-color .2s,transform .2s;isolation:isolate}
.participant-tile:hover{transform:translateY(-2px);filter:brightness(1.15)}
.participant-tile.current{border-color:#65ef98}
.participant-tile.speaking{border-color:#65ff8b;box-shadow:inset 0 0 0 1px #55f38b,0 0 14px #41ff7a7a}
.participant-tile .tile-pfp{border-radius:50%;object-fit:cover;border:2px solid #ffffff28;box-shadow:0 3px 20px #0005}
.participant-tile.speaking .tile-pfp{border:2px solid #65f88b;box-shadow:0 0 12px #59f88b9c}
.participant-tile .tile-name{position:absolute;background:#0d111bc9;color:white;border-radius:7px;font-weight:650;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-tag{position:absolute;right:9px;bottom:10px;background:#10161ba1;display:flex;gap:4px;align-items:center;justify-content:center;border-radius:8px;padding:5px;font-weight:800;font-size:10px}
.status-tag.talking{color:var(--green)}
.status-tag.muted{color:var(--danger)}
.status-tag.tts{color:var(--purple)}
.status-tag .icon{width:17px;height:17px}
.share-thumb .tile-name{max-width:85%}
.gallery{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,220px));grid-template-rows:repeat(2,minmax(0,240px));align-content:center;justify-content:space-evenly;align-items:center;justify-items:center;gap:2vh 1vw;padding:10px 24px}
.gallery-item{background:transparent;border:0;position:relative;width:min(100%,20vh,220px);max-width:220px;aspect-ratio:1;border-radius:100%;padding:0;isolation:isolate}
.gallery-item::before{content:"";position:absolute;inset:-9px;border-radius:50%;background:var(--tint);filter:blur(27px);opacity:.18;z-index:-1;transition:opacity .2s}
.gallery-item:hover::before{opacity:.37}
.gallery-item img{height:100%;width:100%;border-radius:50%;object-fit:cover;border:3px solid color-mix(in srgb,var(--tint),white 32%);box-shadow:0 0 20px color-mix(in srgb,var(--tint),transparent 78%)}
.gallery-item.speaking img{border:3px solid var(--green);box-shadow:0 0 0 2px #2cef715c,0 0 23px #3bfc87ae}
.gallery-item .status-tag{bottom:4px;right:-5px;padding:9px;box-shadow:0 2px 9px #0008}
.gallery-item .status-tag .icon{height:19px;width:19px}
.gallery-name{position:absolute;left:50%;top:calc(100% + 8px);transform:translate(-50%, -6px);padding:7px 16px;min-width:82px;border-radius:999px;white-space:nowrap;background:#151c26e9;border:1px solid #2e3946;box-shadow:0 12px 20px #0006;opacity:0;pointer-events:none;transition:transform .18s,opacity .18s;font-weight:650}
.gallery-item:hover .gallery-name,.gallery-item:focus-visible .gallery-name{opacity:1;transform:translate(-50%,0)}
.call-dock{height:94px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:10px 0 16px;z-index:15}
.dock-inner{display:flex;gap:8px;align-items:center;padding:8px 11px;border:1px solid #303744;background:#171c25ed;border-radius:14px;box-shadow:0 10px 35px #0009}
.dock-button{height:42px;min-width:44px;border-radius:10px;border:1px solid #303746;background:#232a35;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;transition:transform .18s,background .18s;white-space:nowrap}
.dock-button:hover{transform:translateY(-1px);background:#343e4c}
.dock-button.active-green{background:#50f182;border-color:#50f182;color:#082310}
.dock-button.active-purple{border-color:#9e62ef;color:#ebd3ff;background:#3c2754}
.dock-button.active-danger{border-color:#762a37;background:#402129;color:#ff7686}
.dock-button.leave{background:#e74353;color:#fff;border-color:#e74353;padding:0 17px;font-weight:700}
.dock-button.leave:hover{background:#f25b68}
.dock-button small{font-size:11px;font-weight:750}
.dock-button .chevron{width:13px;height:13px}
.dock-button .icon{width:20px;height:20px}
.chat-panel{flex:0 0 var(--chat-width);min-width:0;display:flex;flex-direction:column;border-left:1px solid #1f2835;z-index:30}
.chat-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #28313e}
.chat-title{display:flex;align-items:center;gap:10px;font-weight:750}
.chat-header-actions{display:flex;gap:3px}
.chat-header .icon-btn{color:#d6dfeb}
.chat-messages{flex:1;overflow:auto;scrollbar-color:#374453 transparent;scrollbar-width:thin;padding:13px 17px 10px}
.message{display:flex}
.message-avatar{border-radius:50%;object-fit:cover;flex-shrink:0;margin-top:1px}
.message-content{flex:1;min-width:0}
.message-head{display:flex;align-items:baseline;flex-wrap:wrap;margin:0 0 4px}
.message-text{overflow-wrap:anywhere}
.message-text a{text-decoration:underline;text-underline-offset:2px}
.message-text a:hover{color:#b8ffce}
.tts-chip{background:#483467;color:#e7c8ff;padding:2px 6px;border-radius:5px;font-weight:800;vertical-align:1px;margin-right:4px}
.gif-tag{position:absolute;right:7px;top:7px;font-size:10px;background:#0d1016b9;border-radius:4px;padding:4px 6px;font-weight:700}
.sticker-card{height:120px;max-width:210px;border-radius:8px;background:linear-gradient(125deg,#273960,#785591);display:grid;place-items:center;position:relative;margin-top:5px;font-size:54px;overflow:hidden}
.sticker-card .sticker-emoji{display:block;animation:wiggle .95s ease-in-out infinite alternate}
.file-card{border:1px solid #353e4a;display:flex;align-items:center;padding:12px;margin:7px 0 0;max-width:100%;width:100%}
.file-card .file-symbol{width:36px;display:grid;place-items:center;border-radius:7px}
.file-card strong{display:block;max-width:205px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.file-card:hover{background:#303a48}
.file-card .icon:last-child{margin-left:auto}
.file-unavailable{opacity:.5}
.chat-composer{flex-shrink:0;position:relative}
.compose-shell{display:flex}
.composer-plus{height:34px;width:34px;flex-shrink:0;border:0;border-radius:7px;background:#323b4a;display:grid;place-items:center}
.composer-plus:hover{background:#435162}
.compose-shell textarea{flex:1;min-width:0;background:transparent;border:0;resize:none;outline:none;max-height:120px;scrollbar-width:thin}
.compose-shell textarea:focus{outline:0}
.send-button{background:transparent;color:#58f68d;border:0;height:34px;width:32px;display:grid;place-items:center}
.send-button:hover{color:#c1ffd0}
.chat-popup{position:absolute;bottom:77px;background:#1d2430;border:1px solid #394451;border-radius:11px;box-shadow:0 20px 55px #000c;z-index:40;padding:8px}
.chat-plus-menu{left:14px}
.emoji-menu{right:13px;width:240px}
.emoji-grid button{font-size:22px;border-radius:6px}
.gif-menu{right:12px;max-width:320px;width:310px}
.modal-backdrop{position:fixed;z-index:100;inset:0;background:#04070cc7;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:min(100%,570px);overflow:auto;border:1px solid #394354;border-radius:16px;background:linear-gradient(155deg,#202734,#141b26 75%);box-shadow:0 25px 90px #000d}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 13px;border-bottom:1px solid #303a48;gap:10px}
.modal-head-title{display:flex;align-items:center;gap:11px}
.modal-head-title h2{font-size:18px;margin:0}
.modal-head-title p{font-size:11px;color:#9ba8b9;margin:4px 0 0}
.modal-body{padding:21px 22px}
.modal-footer{padding:12px 22px 20px;display:flex;justify-content:flex-end;gap:9px}
.btn{border-radius:8px;border:1px solid #455064;background:#273343;color:#edf6ff;padding:10px 15px;font-weight:700;font-size:12px}
.btn:hover{background:#344454}
.btn.primary{background:#45e97b;border-color:#45e97b;color:#0b2b18}
.btn.primary:hover{background:#75ffa1}
.btn.danger{background:#e34254;border-color:#e34254}
.input-group{margin-bottom:16px}
.input-group label{display:block;color:#cdd7e5;font-size:12px;font-weight:650;margin-bottom:7px}
.input-group input[type="text"],.input-group input[type="url"],.input-group input[type="number"]{width:100%;height:41px;padding:10px 12px}
.input-group select{width:100%}
.hint{font-size:11px;color:#8e9aac;line-height:1.55}
.field-row{display:flex;align-items:center;justify-content:space-between;gap:17px;padding:11px 0;border-bottom:1px solid #313b48}
.field-row:last-child{border-bottom:0}
.field-title{font-weight:680;font-size:12px}
.field-description{color:#9aa7b9;font-size:10px;margin-top:3px;line-height:1.4}
.switch{width:41px;height:23px;position:relative;background:#424b59;border:0;border-radius:25px;flex-shrink:0;transition:background .18s}
.switch.on{background:#46e782}
.switch:after{content:"";position:absolute;height:17px;width:17px;border-radius:50%;background:white;left:3px;top:3px;transition:left .18s}
.switch.on:after{left:21px}
.account-line{display:flex;align-items:center;gap:17px;padding:1px 0 21px}
.account-line img{height:79px;width:79px;border-radius:100%;object-fit:cover;border:3px solid var(--green)}
.metric{background:#131c27;border:1px solid #303e4e;border-radius:9px;padding:13px}
.metric strong{font-size:18px;display:block;margin-top:3px}
.metric small{color:#8d9baf;font-size:10px}
.shortcut{font-size:10px;color:#7f8c9f;margin-top:8px}
.invite-url{display:flex;gap:7px}
.invite-url input{flex:1;min-width:0;padding:11px}
.notice-dot{width:7px;height:7px;display:inline-block;background:var(--green);border-radius:50%}
.toast-stack{position:fixed;z-index:200;bottom:17px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{border:1px solid #426451;background:#17271de8;color:#f4fcf5;border-radius:9px;box-shadow:0 9px 38px #000b;padding:11px 15px;min-width:180px;max-width:90vw;font-size:12px;animation:toastIn .2s ease-out}
.join-room-card{margin:0 auto 15px;border-radius:10px;background:#141d29;padding:13px;text-align:center}
.join-room-card strong{font-size:17px}
@keyframes pulse{from{box-shadow:0 0 8px #4cf68a99}to{box-shadow:0 0 26px #47ff8bd6}}
@keyframes wiggle{from{transform:rotate(-14deg) scale(.88)}to{transform:rotate(12deg) scale(1.06)}}
@keyframes toastIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
@media (max-width:1250px){
  .chat-panel{flex-basis:320px}
  .call-stage{padding:0 14px}
  .participant-strip{height:100px}
  .participant-tile .tile-pfp{width:62px;height:62px}
  .dock-inner{gap:5px}
  .dock-button{padding:0 10px}
}
@media (max-width:900px){
  .chat-panel{right:0;top:0;bottom:0;width:min(92vw,380px);flex-basis:auto;box-shadow:-14px 0 35px #000b}
  .chat-panel.is-closed{display:none}
  .call-stage{width:100%}
  .gallery{gap:1.5vh 3vw}
  .gallery-item{width:min(24vw,20vh,175px)}
  .participant-strip{overflow-x:auto;justify-content:flex-start;padding-bottom:5px}
  .participant-tile{min-width:125px}
  .call-dock{height:82px}
  .dock-inner{overflow-x:auto;scrollbar-width:none}
  .dock-button.leave{padding:0 13px}
}
@media (max-width:520px){
  .brandless-profile{max-width:105px;gap:5px;padding:5px}
  .brandless-profile img{width:31px;height:31px}
  .brandless-profile strong{display:none}
  .call-stage{padding:0 9px}
  .gallery{grid-template-columns:repeat(2,minmax(0,160px));grid-template-rows:repeat(3,minmax(0,170px));gap:10px}
  .gallery-item{width:min(29vw,15vh)}
  .dock-inner{padding:6px;gap:4px}
  .dock-button{height:38px;min-width:37px;padding:0 8px}
  .dock-button small{font-size:10px}
  .dock-button.leave{padding:0 9px}
  .call-layout{gap:10px}
  .participant-strip{height:96px}
  .primary-card{border-radius:8px}
  .quality{display:none}
  .chat-panel{width:min(100vw,375px)}
}
body.reduce-motion *,body.reduce-motion *::before,body.reduce-motion *::after{animation:none!important;transition:none!important}
#profileButton>*:not(:first-child),.dock-button .chevron{display:none}
#profileButton{width:40px;height:40px;justify-content:center;padding:0;border-radius:8px}
.chat-panel.is-closed{display:none}
.chat-panel{position:relative;background:#202126}
.divider{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;touch-action:none;z-index:5}
.divider:hover,.divider:focus-visible{background:#838efa80}
@media (min-width:901px){
  .chat-panel{flex-basis:min(var(--chat-width),52vw)}
}
@media (max-width:900px){
  .chat-panel{position:absolute}
  .divider{display:none}

.zoom{position:absolute;inset:0;background:transparent;border:0;cursor:zoom-in}
.enlarged .zoom{cursor:zoom-out}
.enlarged .share-media{transform:scale(1.8);transform-origin:var(--origin,center)}
.primary-card:has(.zoom){overflow:hidden;border:1px solid #383a41;box-shadow:none}
.owner{position:absolute;bottom:12px;left:12px;background:#17181ce8;border-radius:4px;padding:5px 9px;opacity:0;pointer-events:none}
.primary-card:hover .owner,.primary-card:focus-within .owner{opacity:1}
.modal,.popover,.chat-popup{background:#26272d;border:1px solid #414249;border-radius:8px;box-shadow:0 8px 28px #0005}
.modal-footer,.modal-head{background:#24252a}
.modal .btn.primary{background:#5865f2;color:white;border:0}
.modal-head h2{font-size:21px}
.avatar-edit{border:0;background:transparent;position:relative;padding:0;border-radius:50%;overflow:hidden}

.avatar-edit span{position:absolute;inset:0;background:#101118aa;color:white;display:grid;place-items:center;opacity:0}

.chat-popup{max-width:calc(100% - 24px);box-sizing:border-box}

.em{height:1.4em;width:1.4em;vertical-align:middle}
.emoji-grid .em{width:25px;height:25px}
.attachment{display:block;max-width:100%;max-height:260px;object-fit:contain;border-radius:5px;margin:4px 0}

.gif-menu form{display:flex;gap:6px}

.own-tile:hover .edit-own,.edit-own:focus-visible{opacity:1}
.call-stage{padding-top:12px}
.chat-header{height:44px;flex:0 0 44px;padding:0 12px}
.chat-title{font-size:16px}

.participant-tile .tile-pfp{width:min(65%,58px);height:auto;aspect-ratio:1}
.participant-tile .tile-name{max-width:calc(100% - 8px);left:4px;bottom:4px;padding:3px 5px}
.picture-actions{display:grid;justify-items:start;gap:8px}
.btn.restore{color:#ffc393;background:#493120;border-color:#795034}

@media (max-width:570px){
  .participant-strip{grid-auto-columns:minmax(74px,1fr);overflow-x:auto}
}
.modal{max-height:calc(100dvh - 36px);display:flex;flex-direction:column}
.modal-head,.modal-footer{flex-shrink:0}
.modal-body{min-height:0;overflow-y:auto}
.settings-section{font-size:14px;margin:18px 0 8px;padding-top:12px;border-top:1px solid #41434b}
.device-access{background:none;border:0;color:#b6bdff;padding:7px 0;cursor:pointer;font-size:13px}
.device-access:hover{text-decoration:underline}
#deviceStatus{font-size:13px;color:#c5c7d0}
.status-tag.deafened{color:#ff8c95;background:#301c23}

.upload-error{margin:0 0 8px;padding:10px 9px 10px 12px;background:#29262b;border:1px solid #58414a;border-radius:7px;display:grid;grid-template-columns:18px 1fr 26px;gap:9px;align-items:start;font:13px/1.4 system-ui;color:#f3eff1}
.upload-error>.icon{color:#f49ba8;width:18px;margin-top:2px}

.upload-error strong,.upload-error span,.upload-error small{display:block}
.upload-error span{color:#d7cbd0;overflow-wrap:anywhere}
.upload-error small{font-size:12px;color:#c1b5bc;margin-top:3px}
.upload-error button{width:26px;height:26px}
.message-content .unfurl{display:grid;background:#272930;border:1px solid #373943;border-left:3px solid #737793;border-radius:4px;margin-top:7px;color:#d9dbe2;text-decoration:none;overflow:hidden;font:13px/1.35 system-ui}
.unfurl strong{color:#aebfff;font-size:14px}
.unfurl:hover strong{text-decoration:underline}
.unfurl small{color:#c7c9d1}
.video-link b{color:#ff5661}
.unfurl img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:3px;margin-top:5px}
.unfurl span{font-size:12px}
.site-link{grid-template-columns:18px 1fr}
.site-link span>*{display:block;overflow-wrap:anywhere}
.left-page{height:100dvh;display:grid;place-content:center;justify-items:center;background:#18191e;color:#f1f1f4;font-family:system-ui;text-align:center;padding:20px}
.left-page h1{font-size:clamp(24px,4vw,36px);margin:17px 0 24px}
.rejoin{background:#49d685;color:#102819;padding:12px 24px;border:0;border-radius:6px;font-weight:700;cursor:pointer}
.settings-float{pointer-events:none!important;background:transparent!important;backdrop-filter:none!important}
.settings-float #modal{pointer-events:auto;position:fixed;bottom:var(--popup-bottom);left:var(--popup-x);width:min(332px,calc(100vw - 16px));border-radius:10px;box-shadow:0 10px 30px #0007}
.settings-float .modal-head h2{font-size:16px}
.settings-float .modal-footer{display:none}
.settings-nav{display:flex;gap:4px;position:sticky;top:0;background:#26272d;padding:8px 0;z-index:2}
.settings-nav button{flex:1;border:0;border-radius:4px;background:transparent;color:#bdc0ca;padding:7px;cursor:pointer}
.settings-nav [aria-pressed=true]{background:#414450;color:white}
.settings-float .account-line img{width:58px;height:58px}
.settings-float .field-row{padding:8px 0}
.settings-float .input-group{margin:8px 0}
.settings-float .picture-actions{gap:4px}
.settings-float .btn{font-size:12px;padding:5px 9px}
#mobileChat{position:relative}
#mobileChat[aria-expanded=true]{background:#434858;color:white}
@media (max-width:900px){
  #chatPanel{bottom:86px}
  .dock-inner{max-width:100%;gap:4px}
  .dock-inner .dock-button{min-width:0}
}
#chatPanel{font-family:"Segoe UI",system-ui,sans-serif;color:#ececf0}
#chatPanel :is(button,input,textarea,select){font-family:inherit}
.chat-messages{padding-inline:14px}
.message{gap:10px;margin-bottom:19px}
.message-avatar{width:42px;height:42px}
.message-head{margin-bottom:2px;gap:8px}
.message-name{font-size:16px;line-height:21px;font-weight:650;color:#f5f5f7}
.message-name:hover{cursor:default;text-decoration:none}
.message-time{font-size:11px;color:#aaaab5}
.message-text{font-size:15px;line-height:1.48;color:#e2e2e7;white-space:pre-wrap}
.message-text a{color:#aabfff}
.tts-chip{font-size:10px}
.file-card{background:#292a30;border-color:#3a3b42;border-radius:7px;gap:10px;text-align:left}
.file-card strong{font-size:14px;overflow-wrap:anywhere}
.file-card small{font-size:12px;color:#b5b5c0}
.file-card .file-symbol{flex:0 0 32px;height:36px;background:transparent;color:#bbbccd}
.file-card .file-symbol .icon{width:26px;height:26px;stroke-width:1.6}
.chat-composer{background:#202126;padding:8px 12px 12px}
.compose-shell{align-items:flex-end;gap:2px;padding:5px 6px;border:1px solid #414248;border-radius:7px;background:#2b2c32}
.compose-shell:focus-within{border-color:#777985}
.compose-shell textarea{font-size:15px;line-height:21px;color:#f2f2f5;padding:6px 4px;min-height:34px}

.compose-shell :is(.composer-plus,.icon-btn,.send-button){border:0;background:transparent;color:#bfc0cb;width:30px;height:34px;display:grid;place-items:center;border-radius:4px;flex:0 0 30px}
.compose-shell button:hover{background:#3b3c44;color:white}
.compose-shell:has(textarea:not(:placeholder-shown)) .send-button{color:#6ce89c}
.member-levels{margin:8px 0;border-block:1px solid #3b3c45;padding:9px 0}
.member-levels summary{cursor:pointer;font-weight:600;font-size:14px}
.member-level{margin:12px 0 6px}
.member-level label{display:flex;align-items:center;gap:8px;font-size:13px}
.member-level img{height:24px;width:24px;border-radius:50%}
.member-level output{margin-left:auto;color:#bfc0cb;font-variant-numeric:tabular-nums}
.member-level input{width:100%;accent-color:#6bdb96}
#chatPanel{background:var(--bg);border-color:var(--border)}
.chat-composer,.chat-header{background:transparent}
.chat-header{border-color:var(--border)}

#chatPanel .compose-shell:focus-within{border-color:#657487}
.compose-shell button,.upload-error .icon-btn{padding:0;display:inline-flex;align-items:center;justify-content:center;line-height:0}
.compose-shell button svg,.upload-error .icon-btn svg{display:block;margin:0}
#emojiBtn,.upload-error .icon-btn{display:grid;place-items:center;grid-template:1fr / 1fr;padding:0}
.upload-error .icon-btn:hover,.compose-shell button:hover{background:#ffffff10}
.message-content .unfurl{gap:3px;padding:11px;font-family:inherit}
.message-content .unfurl strong{font-size:15px;color:#ecf0f7}
.message-content .unfurl small,.message-content .unfurl span{color:#adb8c8}
.message-content .unfurl img{border-radius:5px;margin-top:6px}
.message-content .unfurl:hover,.message-content .unfurl:focus-visible{border-color:#506076}
.settings-nav button{min-width:0;padding-inline:4px}
.share-thumb video,.primary-card video.share-media{width:100%;height:100%;object-fit:contain;background:#080b10}
.settings-float #modal{display:grid;grid-template-columns:46px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);background:#171d26;border-color:#323a47}
.settings-float .modal-head{grid-column:1/-1;background:#171d26;padding:8px 12px;border-bottom:1px solid #2b3341}
.settings-float .modal-head h2{font:650 16px/1.25 "Segoe UI",sans-serif}
.settings-float .modal-head .icon-btn{padding:0;width:28px;height:28px}
.settings-float .settings-nav{position:static;grid-column:1;grid-row:2;display:flex;flex-direction:column;align-items:center;gap:4px;background:#131922;border-right:1px solid #2b3341;padding:8px 0}
.settings-float .settings-nav button{flex:none;width:32px;height:32px;padding:0;display:grid;place-items:center;border-radius:6px}
.settings-float .settings-nav button:is(:hover,[aria-pressed=true]){background:#303a49;color:#f2f5fa}
.settings-float .settings-nav .icon{width:18px;height:18px}
.settings-float .modal-body{grid-column:2;grid-row:2;padding:9px 12px 12px;scrollbar-width:thin}
.settings-float .modal-body select{width:100%;padding:7px 9px;border-radius:6px}
.settings-float .picture-actions button{white-space:normal}
.settings-float .account-line{gap:8px}
.settings-float .input-group label{font-size:13px}
#emojiMenu{border-radius:8px;background:#171d26;border-color:#343e4c;max-height:min(410px,60dvh);scrollbar-width:thin}
.emoji-grid{max-height:min(28dvh,220px);scrollbar-width:thin}
@media (max-width:480px){
  .dock-inner{gap:3px;padding:5px}
  .dock-inner .dock-button{padding-inline:8px}
  .chat-panel{max-width:100vw}
}
.settings-float #modal{height:min(350px,calc(100dvh - var(--popup-bottom) - 10px));max-height:none}
.primary-view:has(.expand-stream){container-type:size}
.primary-card:has(.expand-stream){width:min(100cqw,calc(100cqh * var(--stream-ratio)));height:auto;aspect-ratio:var(--stream-ratio);background:#080b10}
.primary-card:has(.expand-stream) .share-media{width:100%;height:100%;object-fit:contain}
.expand-stream{position:absolute;top:9px;left:9px;display:grid;place-items:center;width:30px;height:30px;padding:0;background:#111821db;border:1px solid #ffffff30;color:white;border-radius:6px;opacity:0;pointer-events:none}
.primary-card:is(:hover,:focus-within) .expand-stream{opacity:1;pointer-events:auto}
.expand-stream:hover{background:#263242}
.expand-stream:focus-visible{opacity:1}
@media (hover:none){
  .expand-stream{opacity:1;pointer-events:auto}
}
@keyframes surface-in{from{opacity:0;transform:translateY(5px) scale(.985)}to{opacity:1;transform:none}}
@keyframes view-in{from{opacity:.3;transform:scale(.99)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
  body:not(.reduce-motion) :is(.chat-popup,.popover,.modal):not([hidden]){animation:surface-in 145ms ease-out;transform-origin:50% 100%}
  body:not(.reduce-motion) .view-enter{animation:view-in 190ms ease-out}
  body:not(.reduce-motion) :is(.expand-stream,.owner,.dock-button,.settings-nav button,#category button){transition:opacity 130ms,background-color 130ms,box-shadow 130ms}
  body:not(.reduce-motion) .share-media{transition:transform 160ms ease-out}
  body:not(.reduce-motion) .settings-float section:not([hidden]){animation:surface-in 110ms ease-out}
}
.stream-expanded .primary-card:has(.expand-stream){width:100%;height:100%;aspect-ratio:auto}
.stream-expanded .primary-card .share-media{object-fit:cover}
.chat-window{display:flow-root}
.chat-window .message{margin:0 0 19px}
.system-icon{flex:0 0 42px;height:42px;display:grid;place-items:center;background:#222c38;border-radius:50%;color:#bccde4}
.system-message .message-text{color:#b9c3cf}
.text-preview{margin:4px 0 0;background:#121923;border:1px solid var(--border);padding:8px 10px;font:12px/1.45 Consolas,monospace;color:#c8d1df;white-space:pre-wrap;overflow-wrap:anywhere;max-height:9em;overflow:auto;border-radius:6px}
.stream-field label{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600}
.stream-field output{color:#b7c4d8;font-variant-numeric:tabular-nums}
.stream-field input{margin:9px 0 0;padding:0}
.share-fps-actual{display:block;margin:12px 2px 2px;color:#adb7c8;font-size:12px;line-height:1.4;font-variant-numeric:tabular-nums}
#chatPanel.is-closed{display:flex;pointer-events:none;visibility:hidden;opacity:0}
@media (min-width:901px){
  #chatPanel{overflow:clip}
  #chatPanel:not(.is-closed){overflow:visible}
  #chatPanel.is-closed{flex-basis:0;border-left-width:0}
  #chatPanel>:not(.divider){min-width:0}
}
@media (max-width:900px){
  #chatPanel.is-closed{transform:translateX(100%)}
}
@media (prefers-reduced-motion:no-preference){
  body:not(.reduce-motion) #chatPanel{transition:flex-basis 190ms ease,transform 190ms ease,opacity 160ms ease,visibility 0s}
  body:not(.reduce-motion) #chatPanel.is-closed{transition-delay:0s,0s,0s,190ms}
  body:has(.divider:active) #chatPanel{transition:none}
}
#chatInput{flex:1;min-width:0;min-height:34px;max-height:120px;overflow-y:auto;padding:6px 4px;color:#f2f2f5;font:15px/22px "Segoe UI",system-ui,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere;outline:0;scrollbar-width:thin;cursor:text}
#chatInput:empty:before{content:attr(data-placeholder);color:#aaabb5;pointer-events:none}
.draft-emoji{display:inline-block;vertical-align:-.22em;height:1.35em;line-height:1}
.draft-emoji .em{display:block;height:1.35em;width:1.35em}
.compose-shell:has(#chatInput:not(:empty)) .send-button{color:#6ce89c}
.chat-window .message{margin-bottom:4px}
.chat-window .message:not(.continuation){padding-top:14px}
.chat-window .continuation{padding-left:52px}
.chat-window .continuation .message-text{line-height:1.42}
.stream-field{padding:6px 2px 10px}
.stream-field input[type=range]{appearance:none;background:transparent;border:0;height:18px;display:block;cursor:pointer}
.stream-field input::-webkit-slider-runnable-track{background:#555c68;border-radius:2px;height:4px}
.stream-field input::-webkit-slider-thumb{appearance:none;height:15px;width:9px;margin-top:-5.5px;background:#d6dae1;border:1px solid #aab0ba;border-radius:2px}
.stream-field input::-moz-range-track{background:#555c68;height:4px;border-radius:2px}
.stream-field input::-moz-range-thumb{background:#d6dae1;border:0;border-radius:2px;width:9px;height:15px}
.range-marks{height:21px;position:relative;margin:0 5px;color:#b7bfcb;font:10px/14px "Segoe UI",sans-serif}
.range-marks span{position:absolute;transform:translateX(-50%);padding-top:5px}
.range-marks span:before{position:absolute;content:"";height:4px;width:1px;background:#76808e;left:50%;top:0}
.range-marks span:first-child{transform:none}
.range-marks span:first-child:before{left:0}
.range-marks span:last-child{transform:translateX(-100%)}
.range-marks span:last-child:before{left:auto;right:0}
.member-level.stream-field label{justify-content:initial;font-weight:400}
.member-level.stream-field input{margin-top:8px}
.expand-stream .icon{stroke-width:1.8;width:18px;height:18px}
#app[hidden]{display:none}

@keyframes popup-shade-in{from{background:#05090c00}to{background:#05090cb3}}
@keyframes popup-shade-out{from{background:#05090cb3}to{background:#05090c00}}
@media (prefers-reduced-motion:no-preference){
  body:not(.reduce-motion) :is(.call-confirm,.join-verify:not(.call-confirm))[open],body:not(.reduce-motion) .invite-popup{animation:popup-pop-in 170ms cubic-bezier(.2,.8,.2,1) both}
  body:not(.reduce-motion) :is(.call-confirm,.join-verify:not(.call-confirm))[open]::backdrop{animation:popup-shade-in 170ms ease-out both}
  body:not(.reduce-motion) :is(.call-confirm,.join-verify:not(.call-confirm)).is-closing,body:not(.reduce-motion) .invite-popup.is-closing{animation:popup-pop-out 120ms ease-in both}
  body:not(.reduce-motion) :is(.call-confirm,.join-verify:not(.call-confirm)).is-closing::backdrop{animation:popup-shade-out 120ms ease-in both}
}
@media (max-width:600px) and (orientation:portrait) and (min-height:540px){

  #app .gallery:has(>.gallery-item:nth-child(5)) .gallery-item{width:min(32vw,calc((100dvh - 125px)/5),136px)!important;margin-bottom:18px}
  #app .gallery:has(>.gallery-item:nth-child(5))>.gallery-item:last-child:nth-child(odd){grid-column:1/-1}
}
@media (max-width:319px){
  #app{min-width:0}
  #app .dock-inner,#app:has(#chatPanel:not(.is-closed)) .dock-inner{width:calc(100% - 12px)!important;grid-template-columns:repeat(7,minmax(34px,1fr))!important;gap:2px!important;padding-inline:4px!important}
  #app .dock-inner>.dock-button{min-width:34px!important;padding-inline:2px!important}
  .settings-docked .settings-nav button{font-size:10px!important}
}
.reply-preview[hidden]{display:none!important}
.reply-preview{display:flex;align-items:center;gap:9px;padding:8px 10px;margin-bottom:6px;border-left:3px solid #64c88a;background:var(--panel2);border-radius:6px;min-width:0}
.reply-preview-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.reply-preview small{font-size:11px;color:var(--muted)}
.reply-preview strong{color:#8cdaad;font-weight:650}
.reply-preview-copy>span{font-size:12px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reply-preview>button{flex:0 0 27px;height:27px;border:0;border-radius:5px;background:transparent;color:var(--muted);font-size:22px;cursor:pointer}

.message-reply-quote{display:flex;flex-direction:column;gap:3px;width:100%;min-width:0;padding:5px 9px;margin:0 0 6px;text-align:left;border:0;border-left:3px solid #6ac38b;border-radius:4px;background:#ffffff0a;color:var(--fg);cursor:pointer}
.message-reply-quote:hover{background:#ffffff14}
.message-reply-quote strong{font-size:12px;font-weight:650;color:#96d7ae}
.message-reply-quote span{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;opacity:.78}
.message-actions [data-message-action=reply]{font-size:20px;line-height:1}

.debug-info-pane>.hint{margin:4px 0 12px;font-size:12px;line-height:1.45}
.debug-totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:0 0 11px}
.debug-totals>div{min-width:0;padding:12px;background:var(--panel2);border:1px solid var(--border);border-radius:8px}
.debug-totals small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}
.debug-totals strong{font-size:18px;font-variant-numeric:tabular-nums;font-weight:650}
.debug-peer-list{display:grid;gap:7px}
.debug-peer-row{border:1px solid var(--border);background:var(--panel2);padding:9px 11px;border-radius:8px;min-width:0}
.debug-peer-head,.debug-peer-rates{display:flex;justify-content:space-between;align-items:center;gap:8px}
.debug-peer-head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.debug-peer-head span{font-size:12px;font-variant-numeric:tabular-nums;color:#9bdab1;white-space:nowrap}
.debug-peer-rates{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:6px}
.join-page.join-lobby{min-height:100dvh;height:100dvh;box-sizing:border-box;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font:14px/1.45 "Segoe UI",Inter,system-ui,sans-serif;color:#edf4f5;background-color:var(--bg)!important;background-image:none!important}
.join-lobby .lobby-layout{width:min(100%,1500px);display:grid;grid-template-columns:minmax(330px,0.76fr) minmax(0,1.24fr);gap:14px;align-items:stretch;margin:auto}
.join-lobby:not(.has-preview) .lobby-layout{width:min(100%,500px);grid-template-columns:minmax(0,1fr)}

.join-lobby .lobby-intro-icon .icon,.join-lobby .lobby-room-icon .icon{width:23px;height:23px}
.join-lobby .pin-control{margin:0 0 13px}

.join-lobby .pin-boxes span.filled{background:#14222a}
.join-lobby .pin-control:focus-within .pin-boxes span.current{border-color:#85e8aa;box-shadow:0 0 0 1px #85e8aa,0 0 15px #61b98835}
.join-lobby .btn.primary{border:0;background:#78dda0;color:#09281c;font-weight:720;min-height:44px;border-radius:8px;box-shadow:none}
.join-lobby .btn.primary:hover{background:#92efb3}

.join-lobby .entrance-secondary{margin-top:8px;min-height:42px;border:1px solid #3a4c59;border-radius:9px;color:#e6eeee;background:#202d38}
.join-lobby .entrance-secondary:hover{background:#2c3e4a}
.join-lobby .lobby-separator{display:flex;align-items:center;gap:11px;color:#a7b5bf;margin:6px 0 2px}
.join-lobby .lobby-separator::before,.join-lobby .lobby-separator::after{content:"";height:1px;background:#36444c;flex:1}
.join-lobby .create-title{margin:10px 0 14px}
.join-lobby .join-back{color:#b9cfcc;background:transparent;border:0;padding:0;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.join-lobby .join-back:hover{color:white}
.join-lobby :is(#createRoomForm,#joinRoomForm) label{display:block;color:#c0cdd8;font-size:13px;font-weight:650;margin:0 0 7px}
.join-lobby :is(#createRoomName,#createName,#joinName){width:100%;border:1px solid #3b4b59;border-radius:9px;background:#0d171f;color:#eff5fa;font-size:15px;min-height:42px;padding:8px 11px;margin-bottom:12px}
.join-lobby .join-room-preview{padding:24px;display:flex;flex-direction:column;gap:15px}
.join-lobby .join-room-preview[hidden]{display:none!important}
.join-lobby .lobby-preview-top{display:flex;justify-content:space-between;align-items:center;gap:14px}
.join-lobby .room-title-line{display:flex;gap:14px;align-items:center;min-width:0}
.join-lobby .room-title-line h2{margin:0;color:#f7fafc;font-size:clamp(22px,1.9vw,29px);line-height:1.1;letter-spacing:-.6px;font-weight:750;overflow-wrap:anywhere}
.join-lobby .lobby-pin-line{color:#adbfcb;margin:6px 0 0;display:flex;align-items:center;gap:7px;font-size:13px}
.join-lobby .lobby-copy-pin{display:grid;place-items:center;border:0;background:transparent;padding:4px;border-radius:6px;color:#b9c7d2}
.join-lobby .lobby-copy-pin:hover{color:#83e6ad;background:#2a3d3f}
.join-lobby .lobby-copy-pin .icon{height:16px;width:16px}
.join-lobby .lobby-count{margin-left:auto;border:1px solid #3d5057;background:#1b2930;border-radius:999px;color:#d3e6df;font-size:12px;font-weight:650;white-space:nowrap;padding:8px 11px}
.join-lobby .lobby-count::before{content:"";display:inline-block;background:#60e79e;width:7px;height:7px;border-radius:50%;margin-right:7px}
.join-lobby .lobby-members{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:11px 10px;align-items:start;min-height:90px;padding:3px 0 0}
.join-lobby .lobby-member{display:flex;align-items:center;flex-direction:column;gap:5px;min-width:0}

.join-lobby .lobby-member-avatar>img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #77899b;background:#273748}
.join-lobby .lobby-member-state{position:absolute;right:-6px;bottom:-4px;border:2px solid #17212c;border-radius:11px;width:29px;height:29px;background:#202b36;color:#fb657e;display:grid;place-items:center}
.join-lobby .lobby-member-state.active{color:#76e8a2}
.join-lobby .lobby-member-state .icon{width:15px;height:15px}
.join-lobby .lobby-member-name{color:#d8e4e8;font-size:12px;font-weight:600;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.join-lobby .lobby-self-card{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(180px,.72fr);gap:15px;padding:15px;border-radius:12px;background:#1c2934;border:1px solid #2b3d49}
.join-lobby .lobby-profile-section{display:flex;gap:12px;align-items:center;min-width:0}
.join-lobby .lobby-avatar-wrap{position:relative;flex:none}
.join-lobby .lobby-avatar-wrap>img{display:block;width:clamp(80px,8vw,112px);height:clamp(80px,8vw,112px);border-radius:50%;object-fit:cover;border:3px solid #7fe5a3;background:#253442}
.join-lobby .lobby-avatar-overlay{position:absolute;right:-5px;bottom:2px;border:1px solid #4a5d6a;background:#263743;width:31px;height:31px;display:grid;place-items:center;border-radius:50%;color:#dceae9}
.join-lobby .lobby-avatar-overlay:hover{background:#344a55}
.join-lobby .lobby-avatar-overlay .icon{width:18px;height:18px}
.join-lobby .lobby-user-fields{flex:1;min-width:0}
.join-lobby .lobby-self-heading{color:#d1dfde;font-weight:700;font-size:14px;margin:0 0 7px}
.join-lobby .lobby-avatar-actions{display:flex;gap:7px;flex-wrap:wrap}
.join-lobby .lobby-avatar-actions button{min-height:32px;border:1px solid #4a5a68;background:#253542;border-radius:8px;color:#e1ecef;padding:6px 10px;font-weight:650;font-size:12px}

.join-lobby .lobby-join-options{border-left:1px solid #3b4c57;padding-left:14px;min-width:0}

.join-lobby .lobby-join-options select{min-height:40px;width:100%;border-radius:8px;background:#0f1a24;border:1px solid #41515b;color:#e7f0f3;font-size:14px;padding:8px 10px}
.join-lobby .lobby-join-options .join-hint{font-size:12px;color:#aab9c3;line-height:1.4;margin:7px 0 0}
.join-lobby .lobby-join-footer{padding-top:2px}
.join-lobby .lobby-join-footer .btn{width:100%;display:flex;justify-content:center;align-items:center;gap:8px;font-size:15px}
.join-lobby .lobby-join-footer small{display:block;color:#9eb2bd;text-align:center;margin-top:7px;font-size:12px}
.join-lobby .lobby-join-footer .icon{width:18px;height:18px}
.join-lobby [hidden]{display:none!important}

/* Pre-Discord voice gallery: circular, transparent participant portraits. */
#app .gallery{display:flex!important;flex-wrap:wrap;justify-content:center;align-content:center;gap:10px}
#app .gallery .gallery-item{flex:none;width:min(36vw,220px)!important;height:auto!important;aspect-ratio:4/3}
#app .gallery .gallery-item{width:clamp(76px,16vw,136px)!important;aspect-ratio:1!important;height:auto!important;background:none!important;box-shadow:none!important;border:0!important;margin-bottom:26px}
#app .gallery{gap:clamp(22px,2.6vw,38px);padding:20px 24px;align-items:center;height:auto}
#app .gallery .gallery-item img{width:100%!important;height:auto!important;aspect-ratio:1!important;box-shadow:none!important}
#app .gallery .gallery-item.speaking img{box-shadow:0 0 0 2px #53dd8b,0 0 10px #53dd8b70!important}
#app .gallery .gallery-item.tts-speaking img{box-shadow:0 0 0 2px #b28bf8,0 0 10px #b28bf870!important}
:root{color-scheme:dark;--bg:#232428;--panel:#1e1f22;--panel2:#2b2d31;--panel3:#383a40;--border:#3b3d44;--fg:#f2f3f5;--muted:#aeb1bb;--green:#23a55a;--green2:#1a8f4b;--purple:#b5a7ff;--danger:#f23f43;--accent:#5865f2;--accent-hover:#4752c4;--accent-soft:#5865f229;--radius:8px}
html,body{background:#1e1f22!important;color:var(--fg)}
body{font-family:"gg sans","Noto Sans",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.007em}
body,button,input,select,textarea,[contenteditable]{-webkit-font-smoothing:antialiased}
button,select,input,textarea{font-family:inherit}
:where(button,input,textarea,select,[tabindex]):focus-visible{outline:2px solid var(--accent)!important;outline-offset:2px}
a{color:#a7b3ff}
::selection{background:#5865f266;color:white}
*{scrollbar-color:#111214 #2b2d31}
button{transition:background-color .12s ease,border-color .12s ease,color .12s ease}
button:disabled{opacity:.4}
.icon{stroke-width:1.85}
body #app,body #app .call-stage,body .call-layout,body .join-page,body .left-page{background:#313338!important}
#app{border-radius:0}
#app .call-stage{padding:0 14px!important;isolation:isolate}
#app .discord-callbar{height:52px;flex:0 0 52px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -14px;padding:0 19px;background:#313338;border-bottom:1px solid #25262b;box-shadow:0 1px 0 #0002;position:relative;z-index:23}
#app .discord-voice-ident{display:flex;align-items:center;gap:11px;min-width:0}
#app .discord-voice-ident>.icon{color:#b7bac4;width:23px;height:23px}
#app .discord-voice-title{display:flex;align-items:center;gap:10px;min-width:0}
#app #voiceRoomName{font-size:15px;font-weight:700;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#app .discord-voice-tag{color:#9da0ac;font-size:11px;font-weight:600;white-space:nowrap;border-left:1px solid #555760;padding-left:10px}
#app .discord-header-tools{display:flex;align-items:center;gap:11px;flex-shrink:0}
#app .discord-member-count{color:#b8bac5;font-size:12px;white-space:nowrap}
#app .discord-member-count:before{content:"";width:7px;height:7px;background:var(--green);display:inline-block;border-radius:50%;margin-right:6px}
#app .discord-header-btn{width:32px;height:32px;display:grid;place-items:center;color:#b9bbc5;background:transparent;border:0;border-radius:6px;padding:0}
#app .discord-header-btn:is(:hover,:focus-visible){background:#404249;color:#fff}
#app .discord-header-btn>.icon{width:20px;height:20px}
#app #callLayout{gap:14px!important;min-height:0}
#app .primary-view{min-height:0}
#app .primary-card{border:1px solid #404249!important;border-radius:12px!important;background:#1e1f22!important;box-shadow:0 4px 18px #0004!important}
#app #primaryCard:has(.focus-person){background:#232428!important}
#app .focus-person{background:#232428!important}
#app .focus-person .big-avatar{border:4px solid #42444c;box-shadow:none}
#app .focus-person h2{font-size:23px;font-weight:720}

 function animatePopupClose(node,done){

let expandMotion=null, memberMotion=null;
function captureMemberStripSize(){
 const layout=$('#callLayout'),strip=layout?.querySelector(':scope > .participant-strip');
 if(!layout||!strip)return;
 const style=getComputedStyle(layout);
 // Freeze this actual on-screen height, not the size implied by a breakpoint.
 layout.style.setProperty('--fixed-member-strip-height',`${strip.getBoundingClientRect().height}px`);
 layout.style.setProperty('--fixed-member-gap',style.rowGap==='normal'?'12px':style.rowGap);
}
function syncExpandedSpace(){
 if(!streamExpanded)return;
 const layout=$('#callLayout'),strip=layout?.querySelector(':scope > .participant-strip');
 if(!strip)return;
 // Responsive recalculation is performed in the non-expanded layout.
 layout.classList.remove('stream-expanded');
 captureMemberStripSize();
 layout.classList.add('stream-expanded');
}
function animateStreamExpansion(){
 const layout=$('#callLayout'),card=$('#primaryCard'),strip=layout?.querySelector(':scope > .participant-strip');
 if(!layout||!card||!strip)return;
 const before=card.getBoundingClientRect(),memberBefore=strip.getBoundingClientRect();
 expandMotion?.cancel();memberMotion?.cancel();
 if(!streamExpanded)captureMemberStripSize();
 streamExpanded=!streamExpanded;
 updateStreamLayout();
 const after=card.getBoundingClientRect(),memberAfter=strip.getBoundingClientRect();
 if(!streamExpanded){layout.style.removeProperty('--fixed-member-strip-height');layout.style.removeProperty('--fixed-member-gap');}
 if(state.reduceMotion||matchMedia('(prefers-reduced-motion: reduce)').matches||!after.width||!after.height)return;
 // FLIP: animate between measured coordinates without changing layout/row sizes.
 const dx=before.x-after.x,dy=before.y-after.y,sx=before.width/after.width,sy=before.height/after.height;
 expandMotion=card.animate([{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,transformOrigin:'top left'},
 {transform:'translate(0,0) scale(1)',transformOrigin:'top left'}],{duration:320,easing:'cubic-bezier(.2,.8,.2,1)'});
 const memberDY=memberBefore.top-memberAfter.top;
 if(Math.abs(memberDY)>0.5)memberMotion=strip.animate([{transform:`translateY(${memberDY}px)`},{transform:'translateY(0)'}],{duration:320,easing:'cubic-bezier(.2,.8,.2,1)'});
}

async function loadFullEmojis(){

  if(!response.ok)throw Error('HTTP '+response.status);
  const pack=await response.json();
  if(!Array.isArray(pack.items)||pack.items.length<1500)throw Error('Incomplete emoji collection');
  const original=catalog.slice();
  catalog.splice(0,catalog.length,...pack.items);
  byName.clear();byGlyph.clear();
  for(const item of catalog){
   for(const name of item[0])byName.set(name,item);
   byGlyph.set(String.fromCodePoint(...item[2].split('-').map(n=>parseInt(n,16))),item);
   if(item[5])byGlyph.set(item[5],item);
  }

  glyphPattern=new RegExp([...byGlyph.keys()].sort((a,b)=>b.length-a.length).map(esc).join('|'),'gu');
  emojiPackReady=true;
  if(typeof renderEmojiPicker==='function')renderEmojiPicker();
  if(typeof queueChat==='function')queueChat();

function setupStreamZoom(){
 const layout=$('#callLayout'),positions=new WeakMap();let drag=null,suppressClick=false;
 function target(e){return e.target.closest('#primaryCard')?.querySelector('.share-media')}
 function position(media){if(!positions.has(media))positions.set(media,{scale:1,x:0,y:0});return positions.get(media)}
 function paint(media){
  const p=position(media),w=media.clientWidth,h=media.clientHeight;
  p.x=Math.max(w*(1-p.scale),Math.min(0,p.x));p.y=Math.max(h*(1-p.scale),Math.min(0,p.y));
  media.style.setProperty('transform-origin','0 0','important');
  media.style.setProperty('transform','translate('+p.x+'px,'+p.y+'px) scale('+p.scale+')','important');
  const button=media.parentElement.querySelector('.zoom');if(button){button.style.cursor=p.scale>1?'grab':'zoom-in';button.setAttribute('aria-pressed',String(p.scale>1))}
 }
 function zoom(media,scale,x,y){
  const p=position(media),next=Math.max(1,Math.min(5,scale)),factor=next/p.scale;
  p.x=x-(x-p.x)*factor;p.y=y-(y-p.y)*factor;p.scale=next;paint(media);
 }
 function point(e,media){const r=media.parentElement.getBoundingClientRect();return [e.clientX-r.left-media.offsetLeft,e.clientY-r.top-media.offsetTop]}
 layout.addEventListener('wheel',e=>{
  const media=target(e);if(!media||e.target.closest('.unfocus,.expand-stream'))return;
  e.preventDefault();zoom(media,position(media).scale*Math.exp(-e.deltaY*.002),...point(e,media));
 },{passive:false});
 layout.addEventListener('pointerdown',e=>{
  if(!e.target.matches('.zoom')||e.button!==0)return;
  const media=target(e);if(!media)return;
  suppressClick=false;
  if(position(media).scale===1)return;
  const p=position(media);drag={media,button:e.target,x:e.clientX,y:e.clientY,px:p.x,py:p.y,moved:false};
  e.target.setPointerCapture(e.pointerId);e.target.style.cursor='grabbing';
 });
 layout.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.hypot(dx,dy)>4)drag.moved=true;
  if(drag.moved){const p=position(drag.media);p.x=drag.px+dx;p.y=drag.py+dy;paint(drag.media)}
 });
 function release(){if(!drag)return;suppressClick=drag.moved;paint(drag.media);drag=null}
 layout.addEventListener('pointerup',release);layout.addEventListener('pointercancel',release);
 layout.addEventListener('lostpointercapture',release);
 layout.addEventListener('click',e=>{
  if(!e.target.matches('.zoom'))return;
  if(suppressClick){suppressClick=false;return}
  const media=target(e);if(media)zoom(media,position(media).scale>1?1:2,...point(e,media));
 });
 new ResizeObserver(()=>{const m=layout.querySelector('#primaryCard .share-media');if(m&&positions.has(m))paint(m)}).observe(layout);
}

function setupContextMenus(){
 let menu=null,previousFocus=null,controller=null;
 function dismiss(restore=false){
  if(!menu)return;
  menu.remove();menu=null;controller.abort();
  if(restore&&previousFocus?.isConnected)previousFocus.focus({preventScroll:true});
 }
 document.addEventListener('contextmenu',event=>{
  const target=event.target;
  if(target.closest('input,textarea,[contenteditable=true],dialog'))return;
  const row=target.closest('[data-message]');
  const participant=target.closest('.participant-tile[data-focus],.gallery-item[data-focus]');
  const screen=target.closest('.stream-thumb,.stream-overview,#primaryCard:has(.share-media)');
  const chat=target.closest('#chatPanel');
  const call=target.closest('.call-stage');
  if(!row&&!participant&&!screen&&!chat&&!call)return;
  event.preventDefault();dismiss();
  previousFocus=document.activeElement;controller=new AbortController();
  menu=document.createElement('div');menu.className='context-menu';menu.setAttribute('role','menu');menu.setAttribute('aria-label','Actions');
  const activeMenu=menu;
  function action(label,run,danger=false){
   const button=document.createElement('button');button.type='button';button.setAttribute('role','menuitem');button.textContent=label;
   if(danger)button.className='danger';
   button.onclick=async()=>{dismiss();try{await run()}catch{toast('That action could not be completed.')}};
   activeMenu.append(button);
  }
  function volume(id){
   if(id==='aster'||!livePeers.has(id))return;
   const label=document.createElement('label');label.className='context-volume';
   const caption=document.createElement('span'),slider=document.createElement('input');
   slider.type='range';slider.min=0;slider.max=200;slider.step=5;slider.value=state.userVolumes[id]??100;slider.setAttribute('aria-label','Participant volume');
   caption.textContent='Volume · '+slider.value+'%';
   slider.oninput=()=>{state.userVolumes[id]=Number(slider.value);caption.textContent='Volume · '+slider.value+'%';syncNetwork()};
   slider.onchange=persist;label.append(caption,slider);activeMenu.append(label);
  }
  function focusScreen(id){if(id==='share'?!!displayStream:livePeers.get(id)?.person.sharing){state.focus=id;renderCall()}}
  function messageAction(id,kind){
   const current=[...document.querySelectorAll('[data-message]')].find(n=>n.dataset.message===id);
   current?.querySelector('[data-message-action="'+kind+'"]')?.click();
  }
  if(row){
   const m=state.chatMessages.find(m=>m.id===row.dataset.message);
   if(!m)return;
   action('Reply',()=>startReply(m));
   action('Add reaction',()=>messageAction(m.id,'react'));
   if(m.text)action('Copy message',()=>navigator.clipboard.writeText(m.text));
   if(m.type==='file'){
    action(state.files.has(m.key)?'Download file':'Fetch file',()=>downloadEntry(m.key));
    const image=row.querySelector('img.attachment');
    if(image)action('Open image',()=>image.click());
    const media=row.querySelector('audio,video');
    if(media)action(media.paused?'Play attachment':'Pause attachment',()=>media.paused?media.play():media.pause());
   }else if(m.type==='gif'){
    const image=row.querySelector('img.attachment');if(image)action('Open GIF',()=>image.click());
   }
   if(m.who==='aster'){
    if(['text','tts','file'].includes(m.type))action('Edit message',()=>messageAction(m.id,'edit'));
    action('Delete message',()=>messageAction(m.id,'delete'),true);
   }
  }else if(screen){
   const id=screen.dataset.focus||state.focus;
   if(screen.id==='primaryCard'){
    action('Show all screens',()=>{state.focus=null;streamExpanded=false;renderCall()});
    action(streamExpanded?'Restore stream size':'Fill available space',animateStreamExpansion);
   }else action('Focus screen',()=>focusScreen(id));
   if(id==='share'||livePeers.get(id)?.person.sharing)action(mutedShares.has(id)?'Unmute screen audio':'Mute screen audio',()=>{
    if(mutedShares.has(id))mutedShares.delete(id);else mutedShares.add(id);
    syncNetwork();
    if(id==='share'&&!displayStream?.getAudioTracks().length)toast('No audio was captured with your screen.');
   });
   volume(id==='share'?'aster':id);
   if(id==='share')action('Stop sharing',()=>askCall('Stop sharing your screen?',closeShare),true);
  }else if(participant){
   const id=participant.dataset.focus;
   if(id==='aster'){
    action(state.muted?'Unmute microphone':'Mute microphone',toggleMicrophone);
    action('Edit profile',()=>openModal('account'));
   }else{
    action((state.userVolumes[id]??100)===0?'Unmute participant':'Mute participant',()=>{
     state.userVolumes[id]=(state.userVolumes[id]??100)===0?100:0;syncNetwork();persist();
    });
    volume(id);
    if(isRoomHost()&&livePeers.has(id)){
     action('Kick from room',()=>confirmModeration(id,'kick'),true);
     action('Ban until host leaves',()=>confirmModeration(id,'ban'),true);
    }
   }
   const sharing=id==='aster'?!!displayStream:livePeers.get(id)?.person.sharing;
   if(sharing)action('Watch screen',()=>focusScreen(id==='aster'?'share':id));
  }else if(chat){
   action(state.modal?.type==='account'?'Hide settings':'Hide chat',()=>state.modal?.type==='account'?closeModal():$('#mobileChat').click());
   action('Upload file',()=>$('#chatFile').click());
  }else{
   action(state.muted?'Unmute microphone':'Mute microphone',toggleMicrophone);
   action(state.deafened?'Undeafen':'Deafen',()=>$('#deafenBtn').click());
   action(state.chatOpen?'Hide chat':'Show chat',()=>$('#mobileChat').click());
   action('Settings',()=>openModal('account'));
  }
  if(!activeMenu.children.length){dismiss();return}
  document.body.append(activeMenu);
  const anchor=target.getBoundingClientRect(),x=event.clientX||anchor.left,y=event.clientY||anchor.bottom;
  activeMenu.style.left=Math.max(8,Math.min(x,innerWidth-activeMenu.offsetWidth-8))+'px';
  activeMenu.style.top=Math.max(8,Math.min(y,innerHeight-activeMenu.offsetHeight-8))+'px';
  activeMenu.querySelector('button')?.focus({preventScroll:true});
  const signal=controller.signal;
  document.addEventListener('pointerdown',e=>{if(!activeMenu.contains(e.target))dismiss()},{signal,capture:true});
  window.addEventListener('resize',()=>dismiss(),{signal});
  window.addEventListener('blur',()=>dismiss(),{signal});
  document.addEventListener('scroll',e=>{if(!activeMenu.contains(e.target))dismiss()},{signal,capture:true});
  activeMenu.addEventListener('keydown',e=>{
   if(e.key==='Escape'||e.key==='Tab'){if(e.key==='Escape')e.preventDefault();dismiss(true);return}
   if(e.target.matches('input'))return;
   if(!['ArrowDown','ArrowUp','Home','End'].includes(e.key))return;
   e.preventDefault();const items=[...activeMenu.querySelectorAll('button,input')],i=items.indexOf(document.activeElement);
   const index=e.key==='Home'?0:e.key==='End'?items.length-1:(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;
   items[index].focus();
  });
 });
}

 let gifRequest;const gifCache=new Map();let pendingTerm=null;
 async function loadGifs(){
 const input=$('#gifSearch input'),results=$('#gifResults'),term=input.value.trim();
 if(!term||term===pendingTerm)return;pendingTerm=term;gifRequest?.abort();const controller=gifRequest=new AbortController();results.textContent='Loading…';
 const params=new URLSearchParams({api_key:'mr4yNn3nRcdRJkHMAEor8aR2qDO5gCvQ',limit:24,rating:'pg-13'});if(term)params.set('q',term);
 try{let data=gifCache.get(term);if(!data){const response=await fetch('https://api.giphy.com/v1/gifs/'+(term?'search':'trending')+'?'+params,{signal:controller.signal});if(!response.ok)throw Error();data=(await response.json()).data;if(controller.signal.aborted)return;gifCache.set(term,data)}results.replaceChildren();
