<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121314">
<title>Workspace — cardrhyme</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121314;color:#ececec;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,a{font:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
a{color:inherit}
.shell{display:flex;flex-direction:column;width:100%;height:100dvh;overflow:hidden}
.top{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #303034;padding:0 22px;background:#121314}
.brand{text-decoration:none;font-size:13px;font-weight:700;letter-spacing:-.02em;color:#eee}
.top-right{display:flex;align-items:center;gap:18px;color:#8d8d93;font-size:12px}
.top-right a{text-decoration:none}
.top-right a:hover{color:#fff}
.workspace{flex:1;min-height:0;min-width:0;display:grid;grid-template-columns:182px minmax(0,1fr)}
.sidebar{border-right:1px solid #303034;padding:24px 12px;overflow-x:hidden;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.nav-label{font:11px ui-monospace,Consolas,monospace;color:#727278;margin:0 10px 13px}
.nav-button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;text-align:left;border:1px solid transparent;border-radius:5px;background:none;color:#9c9ca2;font-size:13px;transition:background .16s,border-color .16s,color .16s}
.nav-button:hover{background:#202124;color:#eee}
.nav-button[aria-current="page"]{background:#232428;color:#eee;border-color:#38393d}
.nav-button .n{font:11px ui-monospace,Consolas,monospace;color:#696a70;width:17px}
.content{min-width:0;min-height:0;position:relative;background:#121314}
.welcome{height:100%;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:40px 22px}
.inner{width:min(100%,620px)}
.kicker{font:12px ui-monospace,Consolas,monospace;color:#8a8a91;margin:0 0 14px}
h1{font-size:clamp(32px,6vw,54px);letter-spacing:-.065em;line-height:1.1;font-weight:740;margin:0}
.desc{font-size:13px;color:#99999e;margin:11px 0 30px;line-height:1.5}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:5px;padding:19px 20px;min-height:107px;justify-content:center;text-align:left;background:#1a1b1d;color:#eee;border:1px solid #303034;border-radius:6px;transition:background .18s,border-color .18s,transform .18s}
.tile:hover{background:#242528;border-color:#64646a;transform:translateY(-2px)}
.tile strong{font-size:15px;letter-spacing:-.02em;font-weight:660}
.tile span{font-size:11px;color:#98989f;line-height:1.5}
.stage{position:absolute;inset:0;display:none;flex-direction:column}
.stage.on{display:flex}
.frame-bar{height:42px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 15px;border-bottom:1px solid #303034;color:#929298;background:#17181a;font-size:12px}
.frame-bar strong{color:#e5e5e7;font-weight:600}
.frame-actions{display:flex;gap:18px;align-items:center}
.frame-actions button,.frame-actions a{border:0;background:none;padding:4px 0;color:#99999f;font-size:12px;text-decoration:none}
.frame-actions button:hover,.frame-actions a:hover{color:#eee}
#appframe{display:block;width:100%;flex:1;min-height:0;border:0;background:#121314}
:focus-visible{outline:2px solid #aaa;outline-offset:3px}
@media(max-width:750px){
.top{height:49px;padding:0 15px}
.workspace{display:flex;flex-direction:column}
.sidebar{flex:none;flex-direction:row;align-items:center;gap:5px;padding:7px 10px;border-right:0;border-bottom:1px solid #303034;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.sidebar::-webkit-scrollbar{display:none}
.nav-label,.nav-button .n{display:none}
.nav-button{flex:none;display:inline-flex;width:auto;padding:8px 11px;font-size:12px;white-space:nowrap}
.content{flex:1;min-height:0}
.welcome{align-items:flex-start;padding:46px 18px}
.inner{max-width:500px}
h1{font-size:36px}
.frame-bar{height:38px;padding:0 11px}
}
@media(max-width:440px){
.tiles{grid-template-columns:1fr;gap:8px}
.tile{min-height:74px;padding:12px 15px}
.desc{margin-bottom:23px}
.frame-actions{gap:12px}
.top-right{gap:12px}
}
@media(prefers-reduced-motion:reduce){.tile,.nav-button{transition:none}.tile:hover{transform:none}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
  <a class="brand" href="/" title="Original homepage">cardrhyme</a>
  <div class="top-right"><span>workspace</span><a href="/" aria-label="Original homepage">Original site ↗</a></div>
</header>
<div class="workspace">
  <nav class="sidebar" aria-label="Apps">
    <div class="nav-label">Applications</div>
    <button class="nav-button" type="button" data-app="home"><span class="n">00</span>Home</button>
    <button class="nav-button" type="button" data-app="reader"><span class="n">01</span>Reader</button>
    <button class="nav-button" type="button" data-app="p2p"><span class="n">02</span>P2P</button>
    <button class="nav-button" type="button" data-app="simbers"><span class="n">03</span>Simbers 5</button>
    <button class="nav-button" type="button" data-app="map"><span class="n">04</span>Map</button>
    <button class="nav-button" type="button" data-app="jpdf"><span class="n">05</span>JPDF</button>
  </nav>
  <main class="content">
    <section class="welcome" id="welcome">
      <div class="inner">
        <p class="kicker">cardrhyme / workspace</p>
        <h1>Your tools, one place.</h1>
        <p class="desc">A consistent minimal theme, applied only while apps run here.</p>
        <div class="tiles">
          <button class="tile" type="button" data-app="reader"><strong>Reader</strong><span>Books and translation.</span></button>
          <button class="tile" type="button" data-app="p2p"><strong>P2P</strong><span>Calls, chat and screen sharing.</span></button>
          <button class="tile" type="button" data-app="simbers"><strong>Simbers 5</strong><span>Rhythm mapping. Monochrome notes.</span></button>
          <button class="tile" type="button" data-app="map"><strong>Map</strong><span>Explore rendered worlds.</span></button>
          <button class="tile" type="button" data-app="jpdf"><strong>JPDF</strong><span>PDF library and reader.</span></button>
        </div>
      </div>
    </section>
    <section class="stage" id="stage" aria-label="Embedded application">
      <div class="frame-bar">
        <strong id="app-title">App</strong>
        <div class="frame-actions"><a id="original-link" target="_blank" rel="noopener">Open original ↗</a><button id="close-app" type="button">Close ×</button></div>
      </div>
      <iframe id="appframe" title="Application" allow="microphone; camera; display-capture; autoplay; clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </section>
  </main>
</div>
</div>

<!-- Scoped CSS overrides: source apps never need to be edited. -->
<template id="theme-reader">
:root,:root[data-theme]{
  color-scheme:dark!important;
  --bg:#121314!important;--surface:#1a1b1d!important;--paper:#202124!important;
  --text:#ececec!important;--muted:#99999e!important;--line:#343539!important;--line2:#292a2d!important;
  --accent:#d4d4d7!important;--accentSoft:#303135!important;--accentText:#e5e5e6!important;
  --topbar:#17181aed!important;--control:#232427!important;--controlHover:#2d2e32!important;
  --cover:#292a2d!important;--readerCanvas:#17181a!important;--hud:#1c1d20ee!important;
  --imageBg:#222326!important;--readingText:#e1e1e4!important;--readingHeading:#fafafa!important;
  --readingLink:#c6c6cb!important;--readerTextActive:#e1e1e4!important;--readerHeadingActive:#fafafa!important;
}
html,body{background:#121314!important;color:#ececec!important}
.topbar{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.btn,.topIcon{border-radius:6px!important;box-shadow:none!important}
</template>

<template id="theme-p2p">
:root{
  --bg:#121314!important;--panel:#1a1b1d!important;--panel2:#202124!important;
  --panel3:#292a2d!important;--border:#343539!important;--muted:#a0a0a6!important;
  --fg:#ececec!important;--green:#d6d6da!important;--green2:#aeafb3!important;
  --purple:#bebec4!important;--radius:8px!important;
}
html,body,.app{background:#121314!important;color:#ececec!important}
.chat-panel,.modal,.settings-panel,.call-dock,.topbar{box-shadow:none!important}
input,select,textarea{background:#202124!important;border-color:#393a3e!important;border-radius:6px!important}
.brandless-profile,.primary-card,.participant-tile,.chat-panel{border-color:#343539!important}
</template>

<template id="theme-simbers">
:root{
  --bg-dark:#121314!important;--bg-panel:#1a1b1d!important;--text:#ececec!important;
  --muted:#9d9da2!important;--primary:#e0e0e2!important;--primary-hover:#c9c9cc!important;
  --secondary:#343539!important;--secondary-hover:#44454a!important;--border:#303034!important;
}
html,body,.app,.card{background:var(--bg-panel)!important;color:var(--text)!important}
.app{background:var(--bg-dark)!important}
.card{border-bottom-color:#303034!important}
.brandMark span:first-child{background:#e8e8eb!important}
.brandMark span:last-child{background:#56575c!important}
button:not(:disabled){box-shadow:none!important}
#analyzeBtn:not(:disabled){color:#151517!important}
.uploadButton,button,.featureIcon{border-radius:5px!important}
.viewerShell,.viewerViewport,.stageWrap{background:#121314!important}
</template>

<template id="theme-viewer">
:root{
  --bg-dark:#121314!important;--bg-panel:#1a1b1d!important;--panel-deep:#121314!important;
  --text:#ececec!important;--muted:#9c9ca1!important;--primary:#dfdfe1!important;
  --primary-hover:#bdbdc2!important;--border:#303034!important;
  --leftColor:#e6e6e8!important;--rightColor:#4e4e53!important;
  --leftGlow:#f1f1f3!important;--rightGlow:#88888e!important;
}
html,body,.stageWrap,.viewerViewport,.playerDock{background:#121314!important;color:#ececec!important}
#stage,#glStage,#lightWide,#lightMid,#lightCore{filter:grayscale(1)!important}
#defaultEnvironmentFrame{filter:grayscale(1)!important}
</template>

<template id="theme-map">
:root{
  color-scheme:dark!important;--ol-background-color:#242528!important;
  --ol-accent-background-color:#303135!important;--ol-subtle-background-color:#1b1c1fcc!important;
  --ol-partial-background-color:#252629ee!important;--ol-foreground-color:#ececec!important;
  --ol-subtle-foreground-color:#a5a5ab!important;--ol-brand-color:#b4b4ba!important;
}
html,body,#map{background:#121314!important;color:#ececec!important}
.world-selector select,.ol-control,.ol-ctx-menu-container,.toastify{
 background:#242528!important;color:#ececec!important;border-color:#404146!important;border-radius:5px!important;
}
.ol-control button{background:#303135!important;color:#e8e8e8!important;border-radius:3px!important}
.ol-ctx-menu-container li:not(.ol-ctx-menu-separator):hover{background:#343539!important}
</template>

<template id="theme-jpdf">
:root{
  color-scheme:dark!important;
  --bg:#121314!important;--surface:#1a1b1d!important;--surface-2:#212225!important;
  --surface-3:#292a2d!important;--surface-glass:#1a1b1d!important;
  --line:#333438!important;--line-2:#45464b!important;--text:#ececec!important;
  --soft:#c0c0c5!important;--muted:#99999f!important;--accent:#cfcfd3!important;
  --accent-2:#e0e0e4!important;--accent-hover:#f1f1f3!important;
  --accent-soft:#2e2f33!important;--shadow:none!important;--shadow-sm:none!important;
}
html,body{background:#121314!important;color:#ececec!important}
.appbar{background:#121314!important}
.mark{background:#dedee1!important;color:#121314!important}
.icon-btn,.pill-btn,.seg-btn,.menu-item,.page-btn{box-shadow:none!important;border-radius:6px!important}
input,select{color:#eaeaec!important}
</template>

<script>
(function(){
  "use strict";
  const apps={
    reader:{name:"Reader",path:"/reader/index.html"},
    p2p:{name:"P2P",path:"/p2p.html"},
    simbers:{name:"Simbers 5",path:"/simbers5.html"},
    map:{name:"Map",path:"/map.html"},
    jpdf:{name:"JPDF",path:"/jpdf.html"}
  };
  const frame=document.getElementById("appframe");
  const welcome=document.getElementById("welcome");
  const stage=document.getElementById("stage");
  const appTitle=document.getElementById("app-title");
  const original=document.getElementById("original-link");
  const nav=Array.from(document.querySelectorAll("[data-app]"));
  const seenFrames=new WeakSet();
  const seenDocuments=new WeakSet();
  let current="home";
  let epoch=0;

  // Runs in the embedded offline Simbers viewer, not the parent app.
  // Modifies its runtime palette and wraps future map-color loads.
  const palettePatch='(function(){'+
    'if(window.__cardrhymeMonoPalette)return;window.__cardrhymeMonoPalette=true;'+
    'function mono(){'+
      'if(typeof COLORS!=="undefined"){' +
        'Object.assign(COLORS.left,{front:"#d9d9dc",side:"#555559",top:"#fafafa",edge:"#f2f2f4"});'+
        'Object.assign(COLORS.right,{front:"#45454a",side:"#202024",top:"#737378",edge:"#8d8d93"});'+
      '}'+
      'if(typeof currentLightColors!=="undefined"){' +
        'currentLightColors.left="#f3f3f5";currentLightColors.right="#828288";currentLightColors.white="#fff";'+
      '}'+
      'document.documentElement.style.setProperty("--leftColor","#d9d9dc","important");'+
      'document.documentElement.style.setProperty("--rightColor","#45454a","important");'+
      'document.documentElement.style.setProperty("--leftGlow","#f3f3f5","important");'+
      'document.documentElement.style.setProperty("--rightGlow","#828288","important");'+
      'if(typeof needsRedraw!=="undefined")needsRedraw=true;'+
      'if(typeof lastRenderedAt!=="undefined")lastRenderedAt=0;'+
    '}'+
    'if(typeof applyViewerColors==="function"){' +
      'var base=applyViewerColors;applyViewerColors=function(){var v=base.apply(this,arguments);mono();return v;};'+
    '}'+
    'mono();'+
  '})();';

  function applyStyle(doc,key){
    const id="cardrhyme-launcher-"+key;
    if(doc.getElementById(id))return;
    const template=document.getElementById("theme-"+key);
    if(!template||!doc.head)return;
    const style=doc.createElement("style");
    style.id=id;
    style.textContent=template.textContent;
    doc.head.appendChild(style);
  }

  function injectPalette(doc){
    if(!doc.head||doc.getElementById("cardrhyme-palette-patch"))return;
    const script=doc.createElement("script");
    script.id="cardrhyme-palette-patch";
    script.textContent=palettePatch;
    doc.head.appendChild(script);
    // Retain element as a flag and to prevent double wrapping.
  }

  function scanNested(doc,owner){
    if(owner!=="simbers")return;
    doc.querySelectorAll("iframe").forEach(function(nested){
      watchFrame(nested,owner,true);
    });
    if(seenDocuments.has(doc))return;
    seenDocuments.add(doc);
    const observer=new MutationObserver(function(records){
      let needed=false;
      for(const record of records){
        if(record.type==="childList"||record.attributeName==="srcdoc"||record.attributeName==="src"){
          needed=true;break;
        }
      }
      if(needed)queueMicrotask(function(){
        if(doc.defaultView && !doc.defaultView.closed)scanNested(doc,owner);
      });
    });
    observer.observe(doc.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:["srcdoc","src"]});
  }

  function decorate(target,owner,nested){
    let doc;
    try{doc=target.contentDocument;}catch(_){return;}
    if(!doc||!doc.documentElement||!doc.head||doc.URL==="about:blank")return;
    applyStyle(doc,nested?"viewer":owner);
    if(owner==="simbers"&&target.id==="localViewerFrame")injectPalette(doc);
    scanNested(doc,owner);
  }

  function watchFrame(target,owner,nested){
    if(!seenFrames.has(target)){
      seenFrames.add(target);
      target.addEventListener("load",function(){
        if(owner===current)decorate(target,owner,nested);
      });
    }
    decorate(target,owner,nested);
  }

  function setCurrent(id,push){
    if(id!=="home"&&!apps[id])id="home";
    if(id===current&&(id==="home"||frame.getAttribute("src")===apps[id].path))return;
    const previous=current;
    current=id;
    epoch++;
    nav.forEach(function(el){
      if(el.classList.contains("nav-button")){
        if(el.dataset.app===id)el.setAttribute("aria-current","page");
        else el.removeAttribute("aria-current");
      }
    });
    if(id==="home"){
      welcome.hidden=false;welcome.style.display="";
      stage.classList.remove("on");
      frame.removeAttribute("src");
    }else{
      welcome.hidden=true;welcome.style.display="none";
      stage.classList.add("on");
      appTitle.textContent=apps[id].name;
      original.href=apps[id].path;
      frame.title=apps[id].name;
      // Unload the prior app instead of keeping five heavy apps alive on phones.
      frame.src=apps[id].path;
    }
    if(push)history.pushState({app:id},"",id==="home"?location.pathname:location.pathname+"?app="+encodeURIComponent(id));
  }

  frame.addEventListener("load",function(){
    if(current!=="home")decorate(frame,current,false);
  });
  nav.forEach(function(el){
    el.addEventListener("click",function(){setCurrent(el.dataset.app,true);});
  });
  document.getElementById("close-app").addEventListener("click",function(){setCurrent("home",true);});
  window.addEventListener("popstate",function(){
    setCurrent(new URLSearchParams(location.search).get("app")||"home",false);
  });
  setCurrent(new URLSearchParams(location.search).get("app")||"home",false);
})();
</script>
</body>
</html>
